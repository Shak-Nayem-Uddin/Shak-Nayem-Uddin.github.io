name: Refresh journal snapshot

# Keeps data.json (the snapshot of the whole site: settings, pages, sections,
# photos and the journal) in step with the live feed. A first-time visitor sees
# this copy first, so it must follow every change made in the admin panel, not
# only new journal entries.
on:
  push:
    branches: [main]
    paths-ignore: [data.json]
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch the journal feed
        env:
          FEED: https://script.google.com/macros/s/AKfycbzWSjYxyV9uwzzUYLCOJSlAuK-STLZxU6yNzZ8cM9NR39qGfdW8mHBgnnc5yWqAKKHT/exec?format=json
        run: |
          curl -fsSL "$FEED" -o feed.tmp
          python3 - <<'PY'
          import json, os
          new = json.load(open("feed.tmp"))
          assert isinstance(new.get("items"), list) and new["items"], "feed returned no entries"
          old = json.load(open("data.json")) if os.path.exists("data.json") else {}
          strip = lambda d: {k: v for k, v in d.items() if k != "updated"}
          if strip(old) == strip(new):
              print("No change in the site content")
          else:
              json.dump(new, open("data.json", "w"), ensure_ascii=False, indent=1)
              print("Snapshot updated:", len(new["items"]), "entries,", len(new.get("sections", [])), "sections")
          PY
          rm -f feed.tmp
      - name: Commit if changed
        run: |
          git add data.json
          if git diff --cached --quiet; then exit 0; fi
          git config user.name "journal-bot"
          git config user.email "journal-bot@users.noreply.github.com"
          git commit -m "Refresh site snapshot"
          git push
