<style>

</style>

<body>

<header class="top"><div class="w">
  <a class="mark" id="mark" href="#">Sk Nayem Uddin</a>
  <nav class="nav" id="nav" aria-label="Pages"></nav>
</div></header>
<main id="main"><div id="app"><section class="sec tone-dark boot"><div class="w">Loading…</div></section></div></main>
<footer><div class="w"><span id="foot-l">Sk Nayem Uddin</span><span id="foot-r"></span></div></footer>

<script>
// Everything on this page comes from the content feed: the admin panel writes it,
// the Apps Script web app serves it, and data.json is a recent copy for a fast first paint.
var FEED = 'https://script.google.com/macros/s/AKfycbzWSjYxyV9uwzzUYLCOJSlAuK-STLZxU6yNzZ8cM9NR39qGfdW8mHBgnnc5yWqAKKHT/exec?format=json';
var MON = {jan:1,feb:2,mar:3,apr:4,may:5,jun:6,jul:7,aug:8,sep:9,oct:10,nov:11,dec:12};
var MN = ['','Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
var F = null, DATA = [], cats = ['All'], st = {cat: 'All', year: 0, q: ''};
var PAGES = [], HOME = 'home', RECPAGE = null, animated = false, live = false, rotTimer = null;

function $(id){ return document.getElementById(id); }
function esc(s){ return String(s == null ? '' : s).replace(/[&<>"]/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]; }); }
function parts(s){ return String(s || '').split(/[,\n]/).map(function(x){ return x.trim(); }).filter(Boolean); }
function lines(s){ return String(s || '').split(/\n/).map(function(x){ return x.trim(); }).filter(Boolean); }
function cells(line){ return line.split('|').map(function(x){ return x.trim(); }); }
function photos(tag){ return (F.photos || []).filter(function(p){ return (p.tags || []).indexOf(tag) > -1; }); }
function all(sel){ return [].slice.call(document.querySelectorAll(sel)); }

// ---------------------------------------------------------------- data
function prep(items){
  items.forEach(function(d){
    var m = String(d.date || '').match(/([A-Za-z]{3})[a-z]*\s+(\d{4})/);
    d.y = parseInt(d.year, 10) || (m ? +m[2] : 0);
    d.m = (m && +m[2] === d.y) ? (MON[m[1].toLowerCase()] || 0) : 0;
    d.hay = [d.ach, d.action, d.metric, d.skills, d.tools, d.org, d.cat].join(' ').toLowerCase();
  });
  return items.filter(function(d){ return d.ach; }).sort(function(a, b){ return b.y - a.y || b.m - a.m; });
}

function render(feed){
  F = feed; F.site = F.site || {}; F.sections = F.sections || []; F.photos = F.photos || [];
  DATA = prep(F.items || []);
  cats = ['All'].concat(DATA.map(function(d){ return d.cat; }).filter(function(c, i, a){ return c && a.indexOf(c) === i; }).sort());
  PAGES = (F.pages || []).filter(function(p){ return F.sections.some(function(s){ return s.page === p.id; }); });
  if (!PAGES.length){ F = null; return failed(); }
  HOME = PAGES[0].id;
  var rec = F.sections.filter(function(s){ return s.type === 'record'; })[0];
  RECPAGE = rec ? rec.page : null;
  chrome();
  $('app').innerHTML = PAGES.map(function(p){
    return '<div class="view" id="v-' + esc(p.id) + '" hidden>' + sections(F.sections.filter(function(s){ return s.page === p.id; })) + '</div>';
  }).join('');
  drawYears(); drawLatest(); drawStats(); rotation();
  show(current(), true);
}

function chrome(){
  var s = F.site, name = s.name || 'Sk Nayem Uddin';
  $('mark').textContent = name; $('mark').setAttribute('data-go', HOME);
  $('nav').innerHTML = PAGES.map(function(p, i){
    return '<a href="' + (i ? '#' + esc(p.id) : '#') + '" data-go="' + esc(p.id) + '"' + (i ? '' : ' class="home-link"') + '>' + esc(p.label) + '</a>';
  }).join('');
  $('foot-l').textContent = '© ' + new Date().getFullYear() + ' ' + name;
  var r = [];
  if (s.email) r.push('<a href="mailto:' + esc(s.email) + '">' + esc(s.email) + '</a>');
  if (s.phone) r.push('<a href="tel:' + esc(s.phone.replace(/[^\d+]/g, '')) + '">' + esc(s.phone) + '</a>');
  $('foot-r').innerHTML = r.join(' &nbsp;|&nbsp; ');
}

function failed(){
  if (F) return;
  $('app').innerHTML = '<section class="sec tone-light"><div class="w"><h1>Sk Nayem Uddin</h1><p class="lead">This page could not load its content just now. Refresh to try again.</p></div></section>';
}

function load(){
  var pending = 2;
  function miss(){ if (--pending === 0 && !F) failed(); }
  fetch('data.json', {cache: 'no-cache'}).then(function(r){ return r.ok ? r.json() : null; })
    .then(function(j){ if (j && j.sections && !live) render(j); else miss(); }).catch(miss);
  fetch(FEED).then(function(r){ return r.json(); })
    .then(function(j){ if (j && j.sections){ live = true; render(j); } else miss(); }).catch(miss);
}

// ---------------------------------------------------------------- sections
function sections(list){
  var out = '', prev = null, i = 0;
  while (i < list.length){
    var s = list[i];
    if (s.column === 'left' || s.column === 'right'){
      var L = [], R = [], tone = s.tone;
      while (i < list.length && (list[i].column === 'left' || list[i].column === 'right')){ (list[i].column === 'left' ? L : R).push(list[i]); i++; }
      out += wrap('cols', tone, prev, '<div class="cols"><div>' + L.map(inner).join('') + '</div><div>' + R.map(inner).join('') + '</div></div>');
      prev = tone; continue;
    }
    var body = inner(s);
    if (body){ out += wrap(s.type, s.tone, prev, body); prev = s.tone; }
    i++;
  }
  return out;
}
function wrap(type, tone, prev, body){
  return '<section class="sec type-' + esc(type) + ' tone-' + esc(tone || 'light') + (prev === tone ? ' join' : '') + '"><div class="w">' + body + '</div></section>';
}
function link(label, target, cls){
  target = target || '';
  if (target.charAt(0) === '#'){
    var id = target.slice(1) || HOME;
    return '<a class="btn ' + cls + '" href="' + (id === HOME ? '#' : esc(target)) + '" data-go="' + esc(id) + '">' + esc(label) + '</a>';
  }
  return '<a class="btn ' + cls + '" href="' + esc(target) + '" target="_blank" rel="noopener">' + esc(label) + '</a>';
}
function inner(s){
  var h = s.heading || '', b = s.body || '';
  switch (s.type){
    case 'hero':
      var btns = lines(s.items).map(function(l, i){ var c = cells(l); return link(c[0], c[1], i ? (s.tone === 'dark' ? 'ghost' : 'outline') : ''); }).join('');
      return '<div class="hero"><div><h1>' + esc(h) + '</h1>' + (b ? '<p>' + esc(b) + '</p>' : '') + (btns ? '<div class="acts">' + btns + '</div>' : '') + '</div>' +
        '<div class="arch"><div class="rotbox" data-tag="portrait"></div></div></div>';
    case 'years':
      return '<div class="years"><h2>' + esc(h) + '</h2><p class="js-count"></p><div class="bars js-bars"></div></div>';
    case 'latest':
      return (h ? '<h2>' + esc(h) + '</h2>' : '') + '<ul class="js-latest" data-n="' + (parseInt(b, 10) || 4) + '"></ul>' +
        (RECPAGE ? '<a class="btn deep" href="#' + esc(RECPAGE) + '" data-go="' + esc(RECPAGE) + '">See every entry</a>' : '');
    case 'record':
      return '<div class="tools"><input id="q" type="search" placeholder="Search entries, skills or tools" aria-label="Search the record"><span id="yearnote"></span></div><div class="chips" id="chips"></div><div id="list"></div>';
    case 'stats':
      return '<div class="meter"><h3>Where the work has been</h3><div class="js-mcat"></div></div><div class="meter"><h3>Skills used most often</h3><div class="js-mskill"></div></div><div class="meter"><h3>Tools</h3><p class="inline js-mtool"></p></div>';
    case 'title':
      return '<h1>' + esc(h) + '</h1>' + (b ? '<p class="lead">' + esc(b) + '</p>' : '');
    case 'text':
      return (h ? '<h3 class="h3">' + esc(h) + '</h3>' : '') + '<div class="prose">' + String(b).split(/\n\s*\n/).filter(function(p){ return p.trim(); }).map(function(p){ return '<p>' + esc(p.trim()).replace(/\n/g, '<br>') + '</p>'; }).join('') + '</div>';
    case 'columns':
      var cols = lines(s.items);
      return (h ? '<h2>' + esc(h) + '</h2>' : '') + '<div class="three" style="--n:' + Math.min(3, cols.length || 1) + '">' + cols.map(function(l){ var c = cells(l); return '<div><h3>' + esc(c[0]) + '</h3>' + (c[1] ? '<p>' + esc(c[1]) + '</p>' : '') + '</div>'; }).join('') + '</div>';
    case 'list':
      return '<div class="plain">' + (h ? '<h3>' + esc(h) + '</h3>' : '') + '<ul>' + lines(s.items).map(function(l){ var c = cells(l); return '<li>' + esc(c[0]) + (c[1] ? '<span>' + esc(c[1]) + '</span>' : '') + '</li>'; }).join('') + '</ul></div>';
    case 'roles':
      return (h ? '<h2 class="sub">' + esc(h) + '</h2>' : '') + lines(s.items).map(function(l){
        var c = cells(l), pts = (c[4] || '').split(';').map(function(x){ return x.trim(); }).filter(Boolean);
        return '<div class="role"><time>' + esc(c[0]) + '</time><div><h3>' + esc(c[1]) + '</h3>' + (c[2] ? '<div class="org">' + esc(c[2]) + '</div>' : '') +
          (c[3] ? '<p>' + esc(c[3]) + '</p>' : '') + (pts.length ? '<ul>' + pts.map(function(p){ return '<li>' + esc(p) + '</li>'; }).join('') + '</ul>' : '') + '</div></div>';
      }).join('');
    case 'gallery':
      var g = photos('gallery');
      if (!g.length) return '';
      return (h ? '<h2>' + esc(h) + '</h2>' : '') + (b ? '<p class="lead2">' + esc(b) + '</p>' : '') + '<div class="shots">' + g.map(function(p){
        return '<figure' + ((p.tags || []).indexOf('big') > -1 ? ' class="big"' : '') + '><img src="' + esc(p.url) + '" loading="lazy" alt="' + esc(p.caption || 'Photo') + '" style="object-position:' + esc(p.position || '50% 50%') + '">' +
          (p.caption ? '<figcaption>' + esc(p.caption) + '</figcaption>' : '') + '</figure>';
      }).join('') + '</div>';
    case 'photo':
      var tag = (b || 'profile').trim().toLowerCase();
      if (!photos(tag).length) return '';
      return '<figure class="pimg"><div class="rotbox" data-tag="' + esc(tag) + '"></div>' + (h ? '<figcaption>' + esc(h) + '</figcaption>' : '') + '</figure>';
    case 'contact':
      var si = F.site, ways = '', acts = '';
      if (si.email){ ways += '<dt>Email</dt><dd><a href="mailto:' + esc(si.email) + '">' + esc(si.email) + '</a></dd>'; acts += '<a class="btn deep" href="mailto:' + esc(si.email) + '">Send an email</a><button class="btn outline" id="copy-email" type="button">Copy email address</button>'; }
      if (si.phone) ways += '<dt>Phone</dt><dd><a href="tel:' + esc(si.phone.replace(/[^\d+]/g, '')) + '">' + esc(si.phone) + '</a></dd>';
      if (si.linkedin) ways += '<dt>LinkedIn</dt><dd><a href="' + esc(si.linkedin) + '" target="_blank" rel="noopener">' + esc(si.linkedin.replace(/^https?:\/\/(www\.)?/, '').replace(/\/$/, '')) + '</a></dd>';
      if (si.email || si.phone) acts += '<a class="btn outline" id="vcard" href="' + vcard() + '" download="' + esc((si.name || 'contact').replace(/\s+/g, '-')) + '.vcf">Save contact</a>';
      return '<div class="reachgrid"><div><h1>' + esc(h) + '</h1>' + (b ? '<p class="reach">' + esc(b) + '</p>' : '') + (ways ? '<dl class="ways">' + ways + '</dl>' : '') + (acts ? '<div class="acts">' + acts + '</div>' : '') + '</div>' +
        (photos('contact').length ? '<div class="arch"><div class="rotbox" data-tag="contact"></div></div>' : '') + '</div>';
  }
  return '';
}

function vcard(){
  var s = F.site, n = (s.name || '').split(' ');
  var v = ['BEGIN:VCARD', 'VERSION:3.0', 'N:' + n.slice(-1).join('') + ';' + n.slice(0, -1).join(' ') + ';;;', 'FN:' + (s.name || ''), 'TITLE:' + (s.role || '')];
  if (s.email) v.push('EMAIL;TYPE=INTERNET:' + s.email);
  if (s.phone) v.push('TEL;TYPE=CELL:' + s.phone.replace(/[^\d+]/g, ''));
  v.push('URL:' + location.origin + location.pathname);
  if (s.location) v.push('ADR;TYPE=WORK:;;;' + s.location.replace(/,/g, '\\,') + ';;;');
  v.push('END:VCARD');
  return 'data:text/vcard;charset=utf-8,' + encodeURIComponent(v.join('\r\n'));
}

// ---------------------------------------------------------------- rotating photos
function rotation(){
  clearInterval(rotTimer);
  all('.rotbox').forEach(function(box){
    var ps = photos(box.dataset.tag);
    if (!ps.length){ var host = box.closest('.arch'); (host || box).remove(); return; }
    box.innerHTML = ps.map(function(p, i){
      return '<img src="' + esc(p.url) + '" alt="' + esc(p.caption || F.site.name || 'Photo') + '" style="object-position:' + esc(p.position || '50% 30%') + '"' + (i ? '' : ' class="on"') + '>';
    }).join('');
  });
  if (window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  var secs = Math.max(2, parseFloat(F.site.rotate_seconds) || 5);
  rotTimer = setInterval(function(){
    if (document.hidden) return;
    all('.rotbox').forEach(function(box){
      if (!box.offsetParent) return;
      var imgs = box.querySelectorAll('img');
      if (imgs.length < 2) return;
      var i = [].map.call(imgs, function(x){ return x.classList.contains('on'); }).indexOf(true), n = (i + 1) % imgs.length;
      if (!(imgs[n].complete && imgs[n].naturalWidth)) return; // wait for the next photo to finish loading
      imgs[i].classList.remove('on'); imgs[n].classList.add('on');
    });
  }, secs * 1000);
}

// ---------------------------------------------------------------- pages (shareable as #page-id)
function current(){ var h = decodeURIComponent(location.hash.slice(1)); return PAGES.some(function(p){ return p.id === h; }) ? h : HOME; }
function show(v, keepScroll){
  all('.view').forEach(function(el){ el.hidden = el.id !== 'v-' + v; });
  all('.nav a').forEach(function(a){ if (a.dataset.go === v) a.setAttribute('aria-current', 'page'); else a.removeAttribute('aria-current'); });
  var p = PAGES.filter(function(x){ return x.id === v; })[0] || {}, s = F.site;
  document.title = v === HOME ? (s.name || '') + (s.role ? ' | ' + s.role : '') : p.label + ' | ' + (s.name || '');
  if (v === RECPAGE) drawRecord();
  if (!keepScroll) window.scrollTo(0, 0);
}
function go(v){
  if (v === HOME){ if (location.hash) history.pushState(null, '', location.pathname); show(v); }
  else if (location.hash === '#' + v) show(v);
  else location.hash = v;
}
window.addEventListener('hashchange', function(){ if (F) show(current()); });
window.addEventListener('popstate', function(){ if (F) show(current()); });

document.addEventListener('click', function(e){
  var g = e.target.closest('[data-go]');
  if (g && F){
    e.preventDefault();
    if (g.dataset.year){ st.year = +g.dataset.year; st.cat = 'All'; st.q = ''; if ($('q')) $('q').value = ''; }
    go(g.dataset.go); return;
  }
  var line = e.target.closest('#list .line');
  if (line){ var more = line.nextElementSibling, open = more.hidden; more.hidden = !open; line.setAttribute('aria-expanded', open ? 'true' : 'false'); return; }
  var chip = e.target.closest('#chips button');
  if (chip){ st.cat = chip.dataset.c; drawRecord(); return; }
  if (e.target.id === 'clr'){ st.year = 0; drawRecord(); return; }
  if (e.target.id === 'copy-email'){
    var b = e.target, email = F.site.email;
    var done = function(t){ b.textContent = t; setTimeout(function(){ b.textContent = 'Copy email address'; }, 2200); };
    try { navigator.clipboard.writeText(email).then(function(){ done('Copied'); }, function(){ done(email); }); } catch (err) { done(email); }
  }
});
document.addEventListener('input', function(e){ if (e.target.id === 'q'){ st.q = e.target.value.trim().toLowerCase(); drawRecord(); } });

// ---------------------------------------------------------------- journal blocks
function drawYears(){
  var ys = DATA.map(function(d){ return d.y; }).filter(Boolean);
  if (!ys.length) return;
  var minY = Math.min.apply(null, ys), maxY = Math.max.apply(null, ys), perY = {}, peak = 1;
  ys.forEach(function(y){ perY[y] = (perY[y] || 0) + 1; if (perY[y] > peak) peak = perY[y]; });
  all('.js-count').forEach(function(el){ el.textContent = DATA.length + ' entries since ' + minY + '.' + (RECPAGE ? ' Choose a year to read it.' : ''); });
  var bh = '';
  for (var y = minY; y <= maxY; y++){
    var n = perY[y] || 0, h = n ? Math.max(4, Math.round(n / peak * 104)) : 1, hs = animated ? ' style="height:' + h + 'px"' : '';
    bh += n ? '<button' + (RECPAGE ? ' data-go="' + esc(RECPAGE) + '" data-year="' + y + '"' : ' disabled') + ' aria-label="' + y + ', ' + n + ' entries"><b>' + n + '</b><i data-h="' + h + '"' + hs + '></i><span>' + y + '</span></button>'
            : '<button disabled aria-label="' + y + ', no entries"><i data-h="1"' + hs + '></i><span>' + y + '</span></button>';
  }
  all('.js-bars').forEach(function(el){ el.innerHTML = bh; });
  if (!animated){
    animated = true;
    setTimeout(function(){ all('.js-bars i').forEach(function(i, k){ setTimeout(function(){ i.style.height = i.dataset.h + 'px'; }, (k % 20) * 45); }); }, 150);
  }
}
function drawLatest(){
  all('.js-latest').forEach(function(ul){
    ul.innerHTML = DATA.slice(0, +ul.dataset.n || 4).map(function(d){
      return '<li><a class="line" href="#' + esc(RECPAGE || '') + '"' + (RECPAGE ? ' data-go="' + esc(RECPAGE) + '"' : '') + '><span class="when">' + (d.m ? MN[d.m] : '') + ' ' + (d.y || '') + '</span><span class="what">' + esc(d.ach) + '</span><span class="cat">' + esc(d.cat) + '</span></a></li>';
    }).join('');
  });
}
function drawRecord(){
  if (!$('list') || !DATA.length) return;
  $('chips').innerHTML = cats.map(function(c){ return '<button data-c="' + esc(c) + '" aria-pressed="' + (c === st.cat) + '">' + esc(c) + '</button>'; }).join('');
  $('yearnote').innerHTML = st.year ? '<button id="clr">Showing ' + st.year + ' only. Show every year</button>' : '';
  if ($('q').value.trim().toLowerCase() !== st.q) $('q').value = st.q;
  var rows = DATA.filter(function(d){ return (st.cat === 'All' || d.cat === st.cat) && (!st.year || d.y === st.year) && (!st.q || d.hay.indexOf(st.q) > -1); });
  if (!rows.length){ $('list').innerHTML = '<p class="none">Nothing matches. Clear the search or choose another category.</p>'; return; }
  var html = '', cur = null, group = [];
  function flush(){ if (cur !== null) html += '<section class="yr"><h3>' + (cur || 'Undated') + '<small>' + group.length + (group.length === 1 ? ' entry' : ' entries') + '</small></h3><ul>' + group.join('') + '</ul></section>'; }
  rows.forEach(function(d){
    if (d.y !== cur){ flush(); cur = d.y; group = []; }
    var dl = '';
    if (d.skills) dl += '<dt>Skills</dt><dd>' + esc(parts(d.skills).join(', ')) + '</dd>';
    if (d.tools) dl += '<dt>Tools</dt><dd>' + esc(parts(d.tools).join(', ')) + '</dd>';
    if (d.org) dl += '<dt>For</dt><dd>' + esc(d.org) + '</dd>';
    group.push('<li class="entry"><button class="line" aria-expanded="false"><span class="when">' + (d.m ? MN[d.m] : '') + '</span><span class="what">' + esc(d.ach) + '</span><span class="cat">' + esc(d.cat) + '</span></button><div class="more" hidden>' +
      (d.action ? '<p>' + esc(d.action) + '</p>' : '') + (d.metric ? '<p>' + esc(d.metric) + '</p>' : '') + (dl ? '<dl>' + dl + '</dl>' : '') + '</div></li>');
  });
  flush();
  $('list').innerHTML = html;
}
function tally(key, split){
  var o = {};
  DATA.forEach(function(d){ (split ? parts(d[key]) : [d[key]]).forEach(function(k){ if (k) o[k] = (o[k] || 0) + 1; }); });
  return Object.keys(o).map(function(k){ return [k, o[k]]; }).sort(function(a, b){ return b[1] - a[1]; });
}
function meter(list){
  var max = list.length ? list[0][1] : 1;
  return list.map(function(r){ return '<div class="m"><div style="--p:' + Math.round(r[1] / max * 100) + '%">' + esc(r[0]) + '</div><b>' + r[1] + '</b></div>'; }).join('');
}
function drawStats(){
  all('.js-mcat').forEach(function(el){ el.innerHTML = meter(tally('cat', false)); });
  all('.js-mskill').forEach(function(el){ el.innerHTML = meter(tally('skills', true).slice(0, 12)); });
  all('.js-mtool').forEach(function(el){ el.textContent = tally('tools', true).slice(0, 16).map(function(r){ return r[0]; }).join(', '); });
}

load();
</script>
