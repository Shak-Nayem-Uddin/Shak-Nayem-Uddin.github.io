<style>
/* ---------- palette and themes
   Every section carries a tone (dark, light, white). Each tone sets the same small set of
   tokens, and the dark theme swaps them, so components never need to know which tone they sit on. */
:root{--navy:#0D1B2E;--navy2:#213A5C;--brass:#C19A4B;--d:"Bricolage Grotesque",system-ui,sans-serif;--s:"Source Serif 4",Georgia,serif;
  --page:#EEF1F5;--body:#101A2B;--head-bg:rgba(13,27,46,.96);--head-fg:#F4F6FA;--head-soft:#B6C3D6;--head-line:rgba(199,210,226,.14);--foot-bg:#0D1B2E;color-scheme:light}
html[data-theme=dark]{--page:#0B1626;--body:#E7ECF3;--head-bg:rgba(7,14,24,.82);--foot-bg:#060C15;color-scheme:dark}

.tone-light{--bg:#EEF1F5;--surface:#FAFBFD}
.tone-white{--bg:#FAFBFD;--surface:#EEF1F5}
.tone-light,.tone-white{--fg:#101A2B;--soft:#556178;--line:rgba(16,26,43,.13);--line2:rgba(16,26,43,.26);--strong:#0D1B2E;--sub:#2B4A75;--acc:#8A6726;--deep-bg:#0D1B2E;--deep-fg:#FAFBFD;--ring:#101A2B;--media:#C7D2E2;--on-bg:#0D1B2E;--on-fg:#FAFBFD;--b1:#2B4A75;--b2:#6A8BB8;--b3:#1A3152;--shadow:rgba(13,27,46,.22)}
.tone-dark{--bg:#0D1B2E;--surface:rgba(199,210,226,.06);--fg:#F4F6FA;--soft:#B3C0D3;--line:rgba(199,210,226,.18);--line2:rgba(199,210,226,.34);--strong:#FFFFFF;--sub:#C7D2E2;--acc:#D4AE62;--deep-bg:#C19A4B;--deep-fg:#0D1B2E;--ring:rgba(199,210,226,.55);--media:#213A5C;--on-bg:#C19A4B;--on-fg:#0D1B2E;--b1:#8FA6C6;--b2:#C9D5E6;--b3:#5E7698;--shadow:rgba(0,0,0,.45)}
[data-theme=dark] .tone-dark{--bg:#070E18}
[data-theme=dark] .tone-light{--bg:#0B1626;--surface:#112036}
[data-theme=dark] .tone-white{--bg:#0E1A2C;--surface:#14243B}
[data-theme=dark] .tone-light,[data-theme=dark] .tone-white{--fg:#E7ECF3;--soft:#9DABC0;--line:rgba(214,224,238,.11);--line2:rgba(214,224,238,.24);--strong:#FFFFFF;--sub:#B9C8DD;--acc:#D4AE62;--deep-bg:#C19A4B;--deep-fg:#0D1B2E;--ring:rgba(214,224,238,.5);--media:#1A2B44;--on-bg:#C19A4B;--on-fg:#0D1B2E;--b1:#7F98BC;--b2:#B8C8DE;--b3:#4F6689;--shadow:rgba(0,0,0,.5)}

*{box-sizing:border-box}
html{scroll-padding-top:84px}
body{margin:0;background:var(--page);color:var(--body);font-family:var(--s);font-size:18px;line-height:1.65;-webkit-font-smoothing:antialiased;transition:background-color .35s}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
:focus-visible{outline:2px solid var(--brass);outline-offset:3px}
.skip{position:absolute;left:-9999px;top:8px;background:var(--brass);color:var(--navy);padding:8px 14px;font-family:var(--d);z-index:20}
.skip:focus{left:8px}
.w{max-width:1120px;margin:0 auto;padding:0 28px}

/* ---------- header */
.top{background:var(--head-bg);-webkit-backdrop-filter:saturate(150%) blur(14px);backdrop-filter:saturate(150%) blur(14px);color:var(--head-fg);position:sticky;top:0;z-index:10;border-bottom:1px solid var(--head-line)}
.top .w{display:flex;align-items:center;gap:28px;height:68px}
.mark{font-family:var(--d);font-weight:700;font-size:19px;letter-spacing:-.01em;margin-right:auto;white-space:nowrap;color:var(--head-fg);text-decoration:none}
.nav{display:flex;gap:26px;overflow-x:auto;scrollbar-width:none}
.nav::-webkit-scrollbar{display:none}
.nav a{font-family:var(--d);font-size:15px;font-weight:500;color:var(--head-soft);padding:6px 0;border-bottom:2px solid transparent;white-space:nowrap;text-decoration:none;transition:color .2s}
.nav a:hover{color:var(--head-fg)}
.nav a[aria-current=page]{color:var(--head-fg);border-color:var(--brass)}
.nav{order:1}
.mode{order:2;flex:none;width:38px;height:38px;border-radius:50%;display:grid;place-items:center;color:var(--head-soft);box-shadow:inset 0 0 0 1px rgba(199,210,226,.28);transition:color .2s,background .2s}
.mode:hover{color:var(--head-fg);background:rgba(199,210,226,.1)}
.mode svg{display:block}
.mode .sun,[data-theme=dark] .mode .moon{display:none}
[data-theme=dark] .mode .sun{display:block}
main{min-height:calc(100vh - 150px)}

/* ---------- sections */
.sec{padding:76px 0;background:var(--bg);color:var(--fg);transition:background-color .35s,color .35s}
.sec.join{padding-top:0}
.sec h2{font-family:var(--d);font-weight:700;font-size:clamp(28px,3.6vw,44px);letter-spacing:-.025em;line-height:1.05;margin:0 0 28px;color:var(--strong)}
.boot{padding:120px 0;font-family:var(--d);color:#B3C0D3;background:var(--navy)}
h1{font-family:var(--d);font-weight:700;font-size:clamp(40px,5.4vw,76px);line-height:1;letter-spacing:-.035em;margin:0 0 28px;color:var(--strong)}

/* ---------- buttons */
.acts{display:flex;gap:14px;flex-wrap:wrap}
.btn{font-family:var(--d);font-weight:600;font-size:16px;padding:13px 22px;border-radius:6px;background:var(--brass);color:var(--navy);text-decoration:none;display:inline-block;line-height:1.3;transition:transform .2s,box-shadow .2s,background-color .2s}
.btn{--bx:0px;--by:0px;transform:translate(var(--bx),var(--by))}
.btn:hover{box-shadow:0 12px 26px -12px var(--shadow)}
.btn.ghost,.btn.outline{background:none;color:var(--fg);box-shadow:inset 0 0 0 1.5px var(--ring)}
.btn.ghost:hover,.btn.outline:hover{box-shadow:inset 0 0 0 1.5px var(--fg)}
.btn.deep{background:var(--deep-bg);color:var(--deep-fg)}

/* ---------- hero */
.type-hero{padding:64px 0 60px}
.hero{display:grid;grid-template-columns:1.5fr 1fr;gap:56px;align-items:center}
.hero p{font-size:21px;max-width:30em;color:var(--soft);margin:0 0 32px}
.hero p.cred{font-family:var(--d);margin:-10px 0 22px;line-height:1.35;max-width:none}
.hero p.cred b{display:block;font-size:21px;font-weight:700;letter-spacing:-.01em;color:var(--strong)}
.hero p.cred span{display:block;font-size:16px;font-weight:600;color:var(--acc);margin-top:4px}
.hero .lede{margin:0 0 30px;max-width:34em}
.hero .lede p{font-size:18.5px;line-height:1.65;max-width:none;margin:0 0 14px}
.hero .lede p.motto{font-family:var(--d);font-size:18px;font-weight:600;letter-spacing:-.005em;color:var(--strong);margin:20px 0 0;padding-left:16px;border-left:2px solid var(--brass)}
.now{display:flex;align-items:center;gap:12px;font-family:var(--d);font-size:15px;font-weight:500;color:var(--soft);margin:0 0 22px}
.now::before{content:"";width:28px;height:2px;background:var(--brass);flex:none}
.hero p.now{font-size:15px;margin:0 0 22px;max-width:none}

/* the portrait sits in a small 3D stage that leans toward the pointer */
.depth{position:relative;width:min(100%,340px);margin-left:auto;perspective:1100px}
.tilt{position:relative;transform-style:preserve-3d;transform:rotateX(var(--rx,0deg)) rotateY(var(--ry,0deg));transition:transform .6s cubic-bezier(.2,.7,.2,1)}
.tilt.live{transition:transform .12s linear}
.arch,.frame{position:relative;width:100%;aspect-ratio:4/5;transform-style:preserve-3d}
.arch::before{content:"";position:absolute;inset:0;border:1.5px solid var(--brass);border-radius:999px 999px 0 0;transform:translate3d(-18px,-18px,-46px)}
.arch .rotbox{position:absolute;inset:0;border-radius:999px 999px 0 0;background:var(--media);box-shadow:0 40px 70px -40px var(--shadow)}
.frame::before{content:"";position:absolute;inset:0;border:1.5px solid var(--brass);border-radius:8px;transform:translate3d(18px,18px,-46px)}
.frame .rotbox{position:absolute;inset:0;border-radius:8px;background:var(--media);box-shadow:0 40px 70px -40px var(--shadow)}
.rotbox{position:relative;overflow:hidden}
.rotbox img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:0;transition:opacity 1.2s ease}
.rotbox img.on{opacity:1}

/* one load moment for the hero and profile headers */
.hero>div:first-child>*,.type-intro .intro>div:first-child>*{animation:rise .9s cubic-bezier(.2,.7,.2,1) both}
.hero>div:first-child>*:nth-child(2),.type-intro .intro>div:first-child>*:nth-child(2){animation-delay:.07s}
.hero>div:first-child>*:nth-child(3),.type-intro .intro>div:first-child>*:nth-child(3){animation-delay:.14s}
.hero>div:first-child>*:nth-child(4),.type-intro .intro>div:first-child>*:nth-child(4){animation-delay:.21s}
.hero>div:first-child>*:nth-child(5),.type-intro .intro>div:first-child>*:nth-child(5){animation-delay:.28s}
.type-hero .depth,.type-intro .depth{animation:arch 1.2s .15s cubic-bezier(.2,.7,.2,1) both}
@keyframes rise{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}
@keyframes arch{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
.settled .hero>div:first-child>*,.settled .type-intro .intro>div:first-child>*,.settled .depth{animation:none}

/* ---------- numbers */
.type-numbers{padding-bottom:60px}
.nums{display:grid;grid-template-columns:repeat(var(--n,4),1fr);border-top:1px solid var(--line)}
.nums div{padding:30px 24px 0 0}
.nums div+div{padding-left:28px;border-left:1px solid var(--line)}
.nums b{display:block;font-family:var(--d);font-weight:700;font-size:clamp(42px,5.2vw,68px);letter-spacing:-.04em;line-height:1;color:var(--strong);font-variant-numeric:tabular-nums}
.nums b .plus{font-style:normal;color:var(--brass);margin-left:.04em}
.nums b .js-num{display:inline;margin:0;font-size:inherit;color:inherit;max-width:none}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.nums strong{display:block;margin-top:18px;font-family:var(--d);font-size:19px;font-weight:600;line-height:1.3;letter-spacing:-.005em;color:var(--fg)}
.nums>div>span{display:block;margin-top:6px;font-size:16px;line-height:1.45;color:var(--soft);max-width:15em}

/* ---------- skills ticker */
.type-ticker{padding:0}
.type-ticker .w{max-width:none;padding:0}
.ticker{overflow:hidden;border-top:1px solid var(--line);border-bottom:1px solid var(--line);-webkit-mask-image:linear-gradient(90deg,transparent,#000 7%,#000 93%,transparent);mask-image:linear-gradient(90deg,transparent,#000 7%,#000 93%,transparent)}
.ticker-track{display:flex;width:max-content;animation:tick var(--dur,70s) linear infinite}
.ticker:hover .ticker-track{animation-play-state:paused}
.ticker span{font-family:var(--d);font-size:15px;font-weight:600;letter-spacing:.06em;color:var(--soft);padding:20px 0;white-space:nowrap}
.ticker span::after{content:"";display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--brass);margin:0 24px;vertical-align:middle}
@keyframes tick{to{transform:translateX(-50%)}}

/* ---------- three columns */
.three{display:grid;grid-template-columns:repeat(var(--n,3),1fr);row-gap:28px}
.three div{padding:0 32px;border-left:1px solid var(--line)}
.three div:nth-child(3n+1){padding-left:0;border-left:0}
.three h3{font-family:var(--d);font-size:21px;font-weight:600;line-height:1.2;margin:0 0 10px;color:var(--strong)}
.three p{margin:0;color:var(--soft);font-size:17px}

/* ---------- 3D year chart */
.years h2{margin-bottom:6px}
.years p{margin:0 0 18px;color:var(--soft);font-size:17px}
.chart3d{width:100%;margin:0}
.chart3d svg{display:block;width:100%;height:auto;overflow:visible}
.chart3d .fl{fill:var(--line)}
.chart3d .base{stroke:var(--line2);stroke-width:1}
.chart3d .f{fill:var(--b1)}.chart3d .t{fill:var(--b2)}.chart3d .s{fill:var(--b3)}
.chart3d .pk .f{fill:#C19A4B}.chart3d .pk .t{fill:#E2C68C}.chart3d .pk .s{fill:#9A7631}
.chart3d .n{font-family:var(--d);font-size:14px;font-weight:700;fill:var(--strong)}
.chart3d .y{font-family:var(--d);font-size:13px;font-weight:500;fill:var(--soft)}
.chart3d a{cursor:pointer;outline:none}
.chart3d a:hover .f,.chart3d a:focus-visible .f{fill:#C19A4B}
.chart3d a:hover .t,.chart3d a:focus-visible .t{fill:#E2C68C}
.chart3d a:hover .s,.chart3d a:focus-visible .s{fill:#9A7631}
.chart3d a:focus-visible .y{fill:var(--strong);text-decoration:underline}
.chart3d .b3{transform-box:fill-box;transform-origin:50% 100%;transform:scaleY(.001);transition:transform .9s cubic-bezier(.2,.7,.2,1);transition-delay:calc(var(--i) * 55ms)}
.chart3d.grown .b3{transform:none}

/* ---------- gallery slideshow */
.lead2{color:var(--soft);max-width:34em;margin:-12px 0 32px}
.show{position:relative}
.stage{position:relative;aspect-ratio:16/8;border-radius:10px;overflow:hidden;background:var(--media);box-shadow:0 40px 80px -50px var(--shadow)}
.stage{perspective:1400px}
.stage figure{position:absolute;inset:0;margin:0;opacity:0;transform:scale(1.06) rotateY(-7deg);transform-origin:20% 50%;transition:opacity 1.3s ease,transform 1.7s cubic-bezier(.2,.7,.2,1)}
.stage figure.on{opacity:1;z-index:1;transform:none}
.stage img{display:block;width:100%;height:100%;object-fit:cover;transform:scale(1.001);transition:transform 8s ease-out}
.stage figure.on img{transform:scale(1.07)}
.stage figcaption{position:absolute;left:0;right:0;bottom:0;padding:64px 28px 22px;background:linear-gradient(transparent,rgba(7,14,24,.88));color:#F4F6FA;font-family:var(--d);font-size:17px;font-weight:500;line-height:1.4}
.show-bar{display:flex;align-items:center;gap:12px;margin-top:16px}
.arrow{flex:none;width:44px;height:44px;border-radius:50%;box-shadow:inset 0 0 0 1.5px var(--line2);color:var(--fg);font-size:18px;display:grid;place-items:center;transition:background .2s}
.arrow:hover{background:var(--line)}
.thumbs{display:flex;gap:10px;flex:1;overflow-x:auto;padding:3px;scrollbar-width:none}
.thumbs::-webkit-scrollbar{display:none}
.thumbs button{flex:0 0 96px;height:62px;border-radius:6px;overflow:hidden;opacity:.45;transition:opacity .3s,box-shadow .3s}
.thumbs button:hover{opacity:.8}
.thumbs button[aria-current=true]{opacity:1;box-shadow:0 0 0 2px var(--brass)}
.thumbs img{width:100%;height:100%;object-fit:cover;display:block}
.count{flex:none;font-family:var(--d);font-size:14px;color:var(--soft);min-width:52px;text-align:right;font-variant-numeric:tabular-nums}

/* ---------- recent work cards */
.cards{display:grid;grid-template-columns:repeat(3,1fr);gap:18px;margin-bottom:30px}
.card{display:flex;flex-direction:column;gap:12px;padding:24px;border-radius:10px;background:var(--surface);box-shadow:inset 0 0 0 1px var(--line);color:inherit;text-decoration:none;transition:box-shadow .25s,transform .25s}
.card:hover{box-shadow:inset 0 0 0 1.5px var(--sub),0 18px 36px -24px var(--shadow);transform:translateY(-3px)}
.card .meta{display:flex;justify-content:space-between;gap:10px;font-family:var(--d);font-size:13px;color:var(--soft)}
.card .meta b{color:var(--sub);font-weight:600}
.card h3{font-family:var(--s);font-weight:600;font-size:19px;line-height:1.35;margin:0;color:var(--strong)}
.card p{margin:0;font-size:15.5px;color:var(--soft);line-height:1.55;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.card .org{margin-top:auto;padding-top:6px;font-family:var(--d);font-size:13px;color:var(--sub)}

/* ---------- closing band */
.type-cta{padding:80px 0}
.cta{display:grid;grid-template-columns:1.5fr auto;gap:36px;align-items:end}
.cta h2{margin-bottom:12px}
.cta p{color:var(--soft);margin:0;max-width:32em;font-size:19px}

/* ---------- page titles */
.type-title{padding:64px 0 0}
.type-title h1{font-size:clamp(40px,6vw,80px)}
.lead{font-size:21px;max-width:34em;margin:-8px 0 44px;color:var(--soft)}
.type-record{padding-bottom:88px}

/* ---------- experience timeline */
.sub{font-family:var(--d);font-weight:700;font-size:28px;letter-spacing:-.02em;margin:0 0 24px;color:var(--strong)}
.role{display:grid;grid-template-columns:200px 1fr;gap:0 36px}
.role time{font-family:var(--d);font-weight:500;font-size:15.5px;color:var(--soft);padding-top:3px;text-align:right}
.role>div{position:relative;padding:0 0 38px 34px;border-left:2px solid var(--line)}
.role:last-child>div{padding-bottom:6px;border-image:linear-gradient(var(--line) 60%,transparent) 1}
.role>div::before{content:"";position:absolute;left:-8px;top:7px;width:14px;height:14px;border-radius:50%;background:var(--bg);box-shadow:inset 0 0 0 2.5px var(--sub)}
.role.current>div::before{background:var(--brass);box-shadow:0 0 0 5px rgba(193,154,75,.22)}
.role h3{font-family:var(--d);font-size:23px;font-weight:600;margin:0;letter-spacing:-.01em;line-height:1.25;color:var(--strong)}
.role .org{color:var(--sub);font-style:italic;margin:2px 0 10px}
.olink{color:inherit;text-decoration:underline;text-decoration-color:color-mix(in srgb,var(--accent) 45%,transparent);text-underline-offset:3px;text-decoration-thickness:1px;transition:color .3s,text-decoration-color .3s}
.olink::after{content:'\2197';font-size:.72em;margin-left:3px;opacity:.55;font-style:normal;display:inline-block}
.olink:hover,.olink:focus-visible{color:var(--accent);text-decoration-color:currentColor}
.role p{margin:0 0 8px;max-width:38em}
.role ul{margin:8px 0 0;padding-left:20px;max-width:38em}
.role li{margin-bottom:4px}
.role li::marker{color:var(--brass)}

/* ---------- the record */
.tools{display:flex;flex-wrap:wrap;gap:14px;align-items:center;margin-bottom:14px}
#q{font-family:var(--d);font-size:16px;padding:12px 14px;border:1.5px solid var(--ring);border-radius:6px;background:var(--surface);color:var(--fg);width:min(100%,360px)}
#q::placeholder{color:var(--soft)}
#clr{font-family:var(--d);font-size:14.5px;text-decoration:underline;text-decoration-color:var(--brass);text-underline-offset:4px}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:36px}
.chips button{font-family:var(--d);font-size:14px;font-weight:500;padding:6px 13px;border-radius:99px;box-shadow:inset 0 0 0 1px var(--line2)}
.chips button[aria-pressed=true]{background:var(--on-bg);color:var(--on-fg);box-shadow:none}
.yr{display:grid;grid-template-columns:150px 1fr;gap:24px;border-top:1.5px solid var(--fg);padding:18px 0 34px}
.yr>h3{font-family:var(--d);font-weight:700;font-size:54px;letter-spacing:-.04em;line-height:1;margin:0;color:var(--strong)}
.yr>h3 small{display:block;font-size:14px;font-weight:500;letter-spacing:0;color:var(--soft);margin-top:8px}
.yr ul{list-style:none;margin:0;padding:0}
.entry{border-bottom:1px solid var(--line)}
.entry:last-child{border-bottom:0}
.line{display:grid;grid-template-columns:48px 1fr auto;gap:16px;width:100%;text-align:left;padding:13px 0;align-items:baseline}
.line .when{font-family:var(--d);font-size:14px;color:var(--soft)}
.line .what{font-size:18px;line-height:1.4}
.line .cat{font-family:var(--d);font-size:13px;color:var(--sub);white-space:nowrap}
.line:hover .what{color:var(--sub);text-decoration:underline;text-decoration-color:var(--brass);text-underline-offset:4px}
.more{padding:2px 0 20px 64px;max-width:44em;font-size:16.5px}
.more p{margin:0 0 10px;white-space:pre-line}
.more dl{display:grid;grid-template-columns:70px 1fr;gap:4px 12px;margin:0;font-family:var(--d);font-size:14px}
.more dt{color:var(--soft)}
.more dd{margin:0}
.none{padding:24px 0;color:var(--soft)}

/* ---------- columns, prose, lists */
.cols{display:grid;grid-template-columns:1.2fr 1fr;gap:64px}
.side-title{font-family:var(--d);font-size:22px;font-weight:600;margin:0 0 12px;color:var(--strong)}
.sec h2.side-title{font-size:22px;letter-spacing:0;margin-bottom:12px}
.prose p{margin:0 0 18px;max-width:34em}
.pimg{margin:0 0 36px}
.pimg .rotbox{aspect-ratio:5/4;border-radius:8px;background:var(--media)}
.pimg figcaption{font-family:var(--d);font-size:14px;color:var(--soft);margin-top:9px}
.plain{border-top:1px solid var(--line);padding-top:22px;margin-top:8px}
.plain h3{font-family:var(--d);font-size:19px;font-weight:600;margin:0 0 14px;color:var(--strong)}
.plain ul{margin:0 0 28px;padding:0;list-style:none}
.plain li{padding:8px 0;border-bottom:1px solid var(--line)}
.plain li span{display:block;font-size:15.5px;color:var(--soft)}
.plain+.plain{border-top:0;padding-top:4px}

/* ---------- contact and the 3D visiting card */
.type-contact{padding:64px 0 88px}
.reachgrid{display:grid;grid-template-columns:1.25fr 1fr;gap:56px;align-items:center}
.reach{font-family:var(--s);font-weight:400;font-size:20px;line-height:1.65;color:var(--soft);max-width:34em;margin:-6px 0 28px}
.card-id{font-family:var(--d);margin:-6px 0 26px;line-height:1.4}
.card-id b{display:block;font-size:20px}
.card-id span{color:var(--sub);font-weight:600;font-size:15px}
.ways{display:grid;grid-template-columns:92px 1fr;gap:12px 20px;margin:0 0 32px;font-family:var(--d);font-size:19px}
.ways dt{color:var(--soft);font-size:15px;padding-top:3px}
.ways dd{margin:0;overflow-wrap:anywhere}
.ways dd a{white-space:nowrap}
.ways .sep{color:var(--soft)}
.ways a{color:inherit;text-decoration:underline;text-decoration-color:var(--brass);text-decoration-thickness:1.5px;text-underline-offset:5px}
.ways a:hover{color:var(--sub)}
.vcbox .depth{width:min(100%,440px);margin:0 auto}
.vc{display:block;width:100%;aspect-ratio:7/4;position:relative;transform-style:preserve-3d;transition:transform .9s cubic-bezier(.2,.7,.2,1);cursor:pointer;border-radius:14px}
.vc[aria-pressed=true]{transform:rotateY(180deg)}
.vc-face{position:absolute;inset:0;-webkit-backface-visibility:hidden;backface-visibility:hidden;border-radius:14px;padding:7% 8%;display:flex;flex-direction:column;font-family:var(--d);overflow:hidden;box-shadow:0 34px 60px -26px rgba(4,10,20,.6)}
.vc-front{background:#0D1B2E;color:#F4F6FA;box-shadow:inset 0 0 0 1px rgba(193,154,75,.55),0 34px 60px -26px rgba(4,10,20,.6)}
.vc-front::after{content:"";position:absolute;inset:0;background:linear-gradient(115deg,transparent 35%,rgba(255,255,255,.09) 48%,transparent 62%);background-size:260% 100%;background-position:var(--sx,50%) 0;pointer-events:none}
.vc-org{font-size:13px;font-weight:500;color:#C7D2E2}
.vc-name{margin-top:auto;font-size:clamp(22px,2.6vw,29px);font-weight:700;letter-spacing:-.02em;line-height:1.1}
.vc-deg{margin-top:6px;font-size:14px;font-weight:600;color:#D4AE62}
.vc-rule{width:44px;height:2px;background:#C19A4B;margin:14px 0 10px}
.vc-role{font-size:14px;color:#C7D2E2}
.vc-back{background:#FAFBFD;color:#101A2B;transform:rotateY(180deg);display:grid;grid-template-columns:1fr 1fr;align-content:center;gap:10px 18px;font-size:clamp(11.5px,1.3vw,13.5px);line-height:1.3;padding:6% 7%}
.vc-back .wide{grid-column:1/-1}
.vc-back b{font-size:12px;font-weight:600;color:#6A7488;display:block}
.vc-back div{overflow-wrap:anywhere}
.vc-hint{font-family:var(--d);font-size:14px;color:var(--soft);text-align:center;margin:22px 0 0}

/* ---------- profile header */
.type-intro{padding:64px 0 76px}
.intro{display:grid;grid-template-columns:1.35fr 1fr;gap:64px;align-items:center}
.intro h1{font-size:clamp(40px,5.6vw,72px);margin:0 0 14px}
.intro .cred{font-family:var(--d);font-weight:600;font-size:17px;color:var(--acc);margin:0 0 22px}
.intro-lead{font-size:20px;line-height:1.6;max-width:32em;margin:0 0 30px;color:var(--soft)}
.facts{display:grid;grid-template-columns:1fr 1fr;gap:18px 32px;margin:0 0 34px;padding-top:24px;border-top:1px solid var(--line)}
.facts dt{font-family:var(--d);font-size:13px;color:var(--soft);margin-bottom:3px}
.facts dd{margin:0;font-family:var(--d);font-weight:600;font-size:16.5px;line-height:1.35}
.type-intro .depth{width:min(100%,380px)}
.jump{display:flex;flex-wrap:wrap;gap:8px 10px;margin-top:34px;padding-top:22px;border-top:1px solid var(--line)}
.jump b{width:100%;font-family:var(--d);font-size:13px;font-weight:500;color:var(--soft)}
.jump button{font-family:var(--d);font-size:14px;font-weight:500;color:var(--fg);padding:6px 13px;border-radius:99px;box-shadow:inset 0 0 0 1px var(--line2);transition:background .2s}
.jump button:hover{background:var(--line)}

/* ---------- expertise and credentials */
.xp{display:grid;grid-template-columns:repeat(3,1fr);gap:18px}
.xp article{position:relative;overflow:hidden;padding:26px 24px 28px;border-radius:10px;background:var(--surface);box-shadow:inset 0 0 0 1px var(--line)}
.xp article::before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--brass);transform:scaleY(.3);transform-origin:top;transition:transform .4s ease}
.xp article:hover::before{transform:none}
.xp h3{font-family:var(--d);font-size:20px;font-weight:600;letter-spacing:-.01em;margin:0 0 16px;color:var(--strong)}
.tags{display:flex;flex-wrap:wrap;gap:8px}
.tag{font-family:var(--d);font-size:13.5px;font-weight:500;line-height:1.3;padding:6px 11px;border-radius:99px;background:var(--bg);box-shadow:inset 0 0 0 1px var(--line);color:var(--fg)}
.badges{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
.badges.two{grid-template-columns:repeat(2,1fr)}
.badge{display:grid;grid-template-columns:1fr auto;align-content:start;gap:6px 14px;padding:18px 20px;border-radius:10px;background:var(--surface);box-shadow:inset 0 0 0 1px var(--line)}
.badge b{font-family:var(--d);font-weight:600;font-size:16.5px;line-height:1.3;color:var(--strong)}
.badge span{grid-column:1;font-size:14.5px;line-height:1.45;color:var(--soft)}
.badge time{grid-row:1;grid-column:2;font-family:var(--d);font-size:13px;font-weight:600;color:var(--acc);white-space:nowrap;padding-top:2px}

/* ---------- journal summary */
.jlead{font-size:19px;color:var(--soft);max-width:36em;margin:-12px 0 30px}
.areas{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:12px;margin:0 0 40px}
.area{padding:20px 20px 18px;border-radius:10px;background:var(--surface);box-shadow:inset 0 0 0 1px var(--line)}
.area b{display:block;font-family:var(--d);font-weight:700;font-size:36px;letter-spacing:-.03em;line-height:1;color:var(--strong)}
.area b small{font-size:14px;font-weight:500;letter-spacing:0;color:var(--soft);margin-left:6px}
.area span{display:block;font-family:var(--d);font-size:15px;font-weight:600;margin-top:10px}
.area i{display:block;height:4px;border-radius:2px;background:var(--line);margin-top:14px;overflow:hidden}
.area i::after{content:"";display:block;height:100%;width:var(--p);background:var(--brass);border-radius:2px}
.jfoot{display:flex;flex-wrap:wrap;gap:28px 48px;align-items:flex-start;justify-content:space-between}
.jfoot>div{flex:1 1 420px}
.jfoot h3{font-family:var(--d);font-size:19px;font-weight:600;margin:0 0 14px;color:var(--strong)}

/* ---------- selected projects */
.projects{border-top:1.5px solid var(--fg)}
.proj{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,2fr);gap:20px 48px;padding:30px 0 32px;border-bottom:1px solid var(--line)}
.proj header{align-self:start}
.proj-tag{display:block;font-family:var(--d);font-size:13.5px;font-weight:600;color:var(--acc);margin-bottom:8px}
.proj h3{font-family:var(--d);font-size:24px;font-weight:700;letter-spacing:-.015em;line-height:1.2;margin:0;color:var(--strong)}
.proj dl{margin:0;display:grid;gap:14px}
.proj dl div{display:grid;grid-template-columns:112px 1fr;gap:16px}
.proj dt{font-family:var(--d);font-size:14px;font-weight:600;color:var(--soft);padding-top:3px}
.proj dd{margin:0;font-size:17px;line-height:1.6}
.proj .res dd{color:var(--strong);font-weight:600}
@media(max-width:820px){
  .proj{grid-template-columns:1fr;gap:16px;padding:24px 0 26px}
  .proj h3{font-size:21px}
  .proj dl div{grid-template-columns:1fr;gap:2px}
  .proj dd{font-size:16.5px}
}

/* ---------- 3D motion
   The portraits sway slowly in depth, the year chart stands up as its blocks rise,
   card groups turn up into place the first time they scroll into view, and the
   visiting card drifts and turns over once to show its back. */
.type-hero .arch,.type-intro .frame{animation:sway 11s ease-in-out infinite alternate}
@keyframes sway{0%{transform:rotateY(-7deg) rotateX(2deg)}50%{transform:rotateY(3deg) rotateX(-2deg)}100%{transform:rotateY(7deg) rotateX(1.5deg)}}
.chart3d{perspective:1100px}
.chart3d svg{transform:rotateX(38deg) translateY(10px);transform-origin:50% 92%;transition:transform 1.4s cubic-bezier(.2,.7,.2,1)}
.chart3d.grown svg{transform:none}
.r3{opacity:0;transform:perspective(900px) rotateX(26deg) translate3d(0,34px,-40px);transform-origin:50% 100%;transition:opacity .7s ease,transform 1s cubic-bezier(.2,.7,.2,1);transition-delay:calc(var(--k,0) * 80ms)}
.r3.in{opacity:1;transform:perspective(900px) rotateX(0) translate3d(0,0,0)}
.vcbox{perspective:1200px}
.vcbox .depth{animation:drift 9s ease-in-out infinite alternate}
@keyframes drift{0%{transform:rotateY(-9deg) rotateX(4deg) translateY(0)}100%{transform:rotateY(9deg) rotateX(-3deg) translateY(-10px)}}
@media (prefers-reduced-motion:reduce){
  .type-hero .arch,.type-intro .frame,.vcbox .depth{animation:none}
  .chart3d svg{transform:none;transition:none}
  .r3{opacity:1;transform:none;transition:none}
}

/* ---------- career at a glance */
.career-top{display:grid;grid-template-columns:auto 1fr;gap:12px 40px;align-items:end;margin-bottom:28px}
.career-n{display:block;font-family:var(--d);font-weight:700;font-size:clamp(64px,8vw,104px);letter-spacing:-.05em;line-height:.9;color:var(--strong)}
.career-n .plus{font-style:normal;color:var(--brass)}
.career-u{display:block;font-family:var(--d);font-weight:600;font-size:16px;margin-top:8px;color:var(--fg)}
.career-top p{margin:0;max-width:36em;color:var(--soft);font-size:18px}
.career-top p strong{color:var(--fg);font-weight:600}
.cbar{display:flex;gap:3px;height:58px;margin:0 0 26px;transform:perspective(900px) rotateX(16deg);transform-origin:50% 100%;filter:drop-shadow(0 18px 18px var(--shadow))}
.seg{position:relative;flex:var(--w) 1 0;min-width:10px;border-radius:5px;background:linear-gradient(180deg,var(--b2),var(--b1));overflow:hidden;transform-origin:0 50%;animation:segin 1.1s cubic-bezier(.2,.7,.2,1) both;animation-delay:calc(var(--i) * 120ms + .2s)}
.seg.cur{background:linear-gradient(180deg,#E2C68C,#C19A4B)}
.seg em{position:absolute;left:12px;top:50%;transform:translateY(-50%);font-style:normal;font-family:var(--d);font-size:13px;font-weight:600;color:#0D1B2E;white-space:nowrap}
@keyframes segin{from{transform:scaleX(0)}to{transform:none}}
.clist{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(2,1fr);gap:10px 40px}
.clist li{display:grid;grid-template-columns:12px 1fr auto;gap:12px;align-items:baseline;padding:12px 0;border-top:1px solid var(--line)}
.clist i{width:10px;height:10px;border-radius:3px;background:var(--b1)}
.clist li.cur i{background:var(--brass)}
.clist b{display:block;font-family:var(--d);font-size:16px;font-weight:600;color:var(--strong)}
.clist span{font-size:15px;color:var(--soft)}
.clist time{font-family:var(--d);font-size:14px;font-weight:600;color:var(--acc);white-space:nowrap}
/* ---------- featured work, message form, small extras */
.cards.feat .card h3{font-family:var(--d);font-size:20px;font-weight:600}
.cards.feat .card .org{color:var(--acc);font-weight:600}
.proj .skl dd{padding-top:2px}
.xp .ev{margin:16px 0 0;padding-top:12px;border-top:1px solid var(--line);font-size:14.5px;line-height:1.5;color:var(--soft)}
.role li b{font-family:var(--d);font-weight:600;color:var(--strong)}
.stage figcaption small{display:block;font-size:12.5px;font-weight:600;color:#E2C68C;margin-bottom:4px;letter-spacing:.02em}
.hero p.cred em{display:block;font-style:normal;font-size:15px;font-weight:500;color:var(--soft);margin-top:8px}
.msg{display:grid;grid-template-columns:1fr 1.3fr;gap:48px;align-items:start}
.mform{display:grid;grid-template-columns:1fr 1fr;gap:16px 18px}
.mform label{display:flex;flex-direction:column;gap:6px;font-family:var(--d);font-size:14px;font-weight:600;color:var(--soft)}
.mform .wide{grid-column:1/-1}
.mform input,.mform select,.mform textarea{font:inherit;font-family:var(--s);font-size:16px;font-weight:400;color:var(--fg);background:var(--surface);border:1.5px solid var(--line2);border-radius:8px;padding:11px 13px;transition:border-color .2s}
.mform input:focus,.mform select:focus,.mform textarea:focus{outline:none;border-color:var(--brass)}
.mform-foot{display:flex;flex-wrap:wrap;align-items:center;gap:12px 18px}
.mform-note{font-family:var(--d);font-size:13.5px;color:var(--soft)}
.mform .bad{border-color:#C0563B}
@media(max-width:820px){
  .career-top{grid-template-columns:1fr;gap:8px}
  .cbar{height:44px}
  .seg em{display:none}
  .clist{grid-template-columns:1fr}
  .msg{grid-template-columns:1fr;gap:20px}
  .mform{grid-template-columns:1fr}
  .hero>div:first-child{display:flex;flex-direction:column}
  .hero>div:first-child>.acts{order:4;margin:0 0 28px}
  .hero>div:first-child>.lede{order:5}
}
@media (prefers-reduced-motion:reduce){ .seg{animation:none} }

/* ---------- motion layer
   Blueprint grid and a slow brass glow behind the dark headers (the work is building systems),
   a soft light that follows the pointer on dark bands, headlines that rise word by word,
   section titles that wipe in, cards that lean in 3D under the pointer, a timeline that fills
   as you read, a reading-progress line, and pages that turn in when you change them. */
#prog{position:fixed;left:0;top:0;height:2px;width:100%;background:var(--brass);transform-origin:0 50%;transform:scaleX(0);z-index:30;pointer-events:none}
.type-hero,.type-intro{position:relative;overflow:hidden;isolation:isolate}
.type-hero>.w,.type-intro>.w{position:relative;z-index:1}
.type-hero::before,.type-intro::before{content:"";position:absolute;left:-40%;right:-40%;bottom:-12%;height:68%;z-index:0;pointer-events:none;
  background-image:linear-gradient(rgba(199,210,226,.09) 1px,transparent 1px),linear-gradient(90deg,rgba(199,210,226,.09) 1px,transparent 1px);background-size:72px 72px;
  transform:perspective(700px) rotateX(64deg);transform-origin:50% 100%;
  -webkit-mask-image:linear-gradient(to top,#000 5%,transparent 80%);mask-image:linear-gradient(to top,#000 5%,transparent 80%);animation:grid 16s linear infinite}
.type-hero::after,.type-intro::after{content:"";position:absolute;width:620px;height:620px;right:-140px;top:-220px;z-index:0;pointer-events:none;border-radius:50%;
  background:radial-gradient(closest-side,rgba(193,154,75,.2),rgba(193,154,75,0));animation:orb 20s ease-in-out infinite alternate}
@keyframes grid{to{background-position:0 72px,0 0}}
@keyframes orb{0%{transform:translate(0,0) scale(1)}100%{transform:translate(-160px,120px) scale(1.25)}}
.tone-dark.spot{background-image:radial-gradient(520px circle at var(--mx,50%) var(--my,50%),rgba(199,210,226,.07),transparent 60%)}
.kin{perspective:700px}
.kin .wd{display:inline-block;overflow:hidden;vertical-align:top;padding-bottom:.08em;margin-bottom:-.08em}
.kin .wd>span{display:inline-block;transform:translateY(100%) rotateX(-75deg);transform-origin:50% 100%;opacity:0;animation:word .95s cubic-bezier(.2,.7,.2,1) forwards;animation-delay:calc(var(--w) * 65ms + .1s)}
@keyframes word{to{transform:none;opacity:1}}
.hero>div:first-child>h1.kin,.type-intro .intro>div:first-child>h1.kin{animation:none}
.h2r{clip-path:inset(0 100% 0 0);transform:translateY(10px);transition:clip-path 1.1s cubic-bezier(.2,.7,.2,1),transform 1.1s cubic-bezier(.2,.7,.2,1)}
.h2r.in{clip-path:inset(0 -2% -20% 0);transform:none}
.lean{position:relative;transform-style:preserve-3d;will-change:transform}
.lean::after{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;opacity:0;transition:opacity .3s;
  background:radial-gradient(260px circle at var(--gx,50%) var(--gy,50%),rgba(255,255,255,.16),transparent 60%)}
.lean.on::after{opacity:1}
.role>div::before,.role::before{z-index:1}
.role>div::after{content:"";position:absolute;left:-2px;top:0;width:2px;height:calc(var(--fill,0) * 100%);background:var(--brass);transition:height .2s linear}
.view.enter{animation:pagein .65s cubic-bezier(.2,.7,.2,1)}
@keyframes pagein{from{opacity:0;transform:perspective(1400px) rotateX(5deg) translateY(28px)}to{opacity:1;transform:none}}
@media(max-width:820px){
  .role::after{content:"";position:absolute;left:-2px;top:0;width:2px;height:calc(var(--fill,0) * 100%);background:var(--brass);transition:height .2s linear}
  .role>div::after{display:none}
  .type-hero::after,.type-intro::after{width:380px;height:380px;right:-160px;top:-120px}
}
@media (prefers-reduced-motion:reduce){
  .type-hero::before,.type-intro::before,.type-hero::after,.type-intro::after{animation:none}
  .kin .wd>span{animation:none;transform:none;opacity:1}
  .h2r{clip-path:none;transform:none;transition:none}
  .view.enter{animation:none}
  .stage figure{transform:none}
  #prog{display:none}
}

footer{background:var(--foot-bg);color:#B3C0D3;font-family:var(--d);font-size:14px;padding:26px 0;transition:background-color .35s}
footer .w{display:flex;justify-content:space-between;gap:10px 24px;flex-wrap:wrap}
footer a{color:#F4F6FA;text-decoration:none}
footer a:hover{text-decoration:underline}

  .nav a.home-link{display:none}
  .sec{padding:54px 0}
  .sec.join{padding-top:0}
  .hero,.intro{grid-template-columns:1fr;gap:40px}

  .nums{grid-template-columns:1fr 1fr}
  .nums div,.nums div+div{padding:24px 12px 0 0;border-left:0}
  .nums div:nth-child(n+3){border-top:1px solid var(--line);margin-top:24px}
  .three{grid-template-columns:1fr}
  .three div{padding:20px 0;border-left:0;border-top:1px solid var(--line)}

  .cta{grid-template-columns:1fr}
  .role{display:block;position:relative;padding:0 0 30px 30px;border-left:2px solid var(--line)}
  .role:last-child{padding-bottom:4px;border-image:linear-gradient(var(--line) 60%,transparent) 1}
  .role time{display:block;text-align:left;margin-bottom:4px;padding:0}
  .role>div,.role:last-child>div{padding:0;border:0}
  .role>div::before{display:none}
  .role::before{content:"";position:absolute;left:-8px;top:5px;width:14px;height:14px;border-radius:50%;background:var(--bg);box-shadow:inset 0 0 0 2.5px var(--sub)}
  .role.current::before{background:var(--brass);box-shadow:0 0 0 5px rgba(193,154,75,.22)}
  .yr{grid-template-columns:1fr;gap:8px}.yr>h3{font-size:40px}
  .line{grid-template-columns:40px 1fr}.line .cat{display:none}
  .more{padding-left:56px}
  .cols{grid-template-columns:1fr;gap:32px}
  .reachgrid{grid-template-columns:1fr;gap:40px}
  .ways{grid-template-columns:72px 1fr;gap:10px 14px;font-size:17px}
  .ways dt{font-size:14px}
}
@media (prefers-reduced-motion:reduce){
  .hero>div:first-child>*,.type-intro .intro>div:first-child>*,.depth{animation:none}
  .rotbox img,.stage figure,.stage img,.vc,.tilt,.chart3d .b3{transition:none}
  .ticker-track{animation:none;flex-wrap:wrap;width:auto}
  .stage figure.on img{transform:none}
}

/* =====================================================================
   Night plum theme
   Near-black with a plum glow, glass surfaces, white pill buttons,
   Inria Sans headings set with air between the letters, Nunito for reading.
   Light mode keeps the same structure on a warm off-white.
   ===================================================================== */
:root{--d:"Inria Sans",ui-sans-serif,system-ui,sans-serif;--s:"Nunito",ui-sans-serif,system-ui,sans-serif;
  --navy:#0E0B0D;--brass:#7E3A5E;--accent:#7E3A5E;--glow1:rgba(126,58,94,.10);--glow2:rgba(84,42,94,.08);
  --page:#F6F2F4;--body:#1C1418;--head-bg:rgba(250,246,248,.82);--head-fg:#1C1418;--head-soft:#6E6169;--head-line:rgba(28,20,24,.08);--foot-bg:#140D11}
html[data-theme=dark]{--brass:#D6A9C0;--accent:#D6A9C0;--glow1:rgba(122,34,82,.30);--glow2:rgba(70,30,90,.22);
  --page:#0E0B0D;--body:#F4EFF2;--head-bg:rgba(14,11,13,.72);--head-fg:#FFFFFF;--head-soft:#CFC4CA;--head-line:rgba(255,255,255,.06);--foot-bg:#0A0809}

/* tones: light mode */
.tone-light{--bg:#F6F2F4;--surface:rgba(255,255,255,.72)}
.tone-white{--bg:#FCFAFB;--surface:rgba(246,242,244,.9)}
.tone-light,.tone-white{--fg:#1C1418;--soft:#6B5E66;--line:rgba(28,20,24,.10);--line2:rgba(28,20,24,.2);--strong:#140D11;--sub:#7E3A5E;--acc:#7E3A5E;--deep-bg:#1C1418;--deep-fg:#FFFFFF;--ring:rgba(28,20,24,.55);--media:#E7DCE2;--on-bg:#1C1418;--on-fg:#FFFFFF;--b1:#8E4A6E;--b2:#C08AA6;--b3:#5E2A47;--shadow:rgba(40,12,28,.18);--btn-bg:#1C1418;--btn-fg:#FFFFFF;--glass-line:rgba(28,20,24,.08)}
.tone-dark{--bg:#140D11;--surface:rgba(103,95,100,.16);--fg:#F4EFF2;--soft:#C9BCC3;--line:rgba(255,255,255,.09);--line2:rgba(255,255,255,.18);--strong:#FFFFFF;--sub:#E2C3D3;--acc:#D6A9C0;--deep-bg:#FFFFFF;--deep-fg:#0E0B0D;--ring:rgba(255,255,255,.4);--media:#2A1B24;--on-bg:#FFFFFF;--on-fg:#0E0B0D;--b1:#8E4A6E;--b2:#C08AA6;--b3:#5E2A47;--shadow:rgba(0,0,0,.55);--btn-bg:#FFFFFF;--btn-fg:#0E0B0D;--glass-line:rgba(255,255,255,.08)}
/* tones: dark mode, one continuous night with glows that move from side to side */
[data-theme=dark] .tone-dark,[data-theme=dark] .tone-light,[data-theme=dark] .tone-white{--bg:#0E0B0D;--surface:rgba(103,95,100,.14);--fg:#F4EFF2;--soft:#BFB2B9;--line:rgba(255,255,255,.08);--line2:rgba(255,255,255,.16);--strong:#FFFFFF;--sub:#E2C3D3;--acc:#D6A9C0;--deep-bg:#FFFFFF;--deep-fg:#0E0B0D;--ring:rgba(255,255,255,.38);--media:#251820;--on-bg:#FFFFFF;--on-fg:#0E0B0D;--b1:#7A3A5E;--b2:#B47A98;--b3:#4E2038;--shadow:rgba(0,0,0,.6);--btn-bg:#FFFFFF;--btn-fg:#0E0B0D;--glass-line:rgba(255,255,255,.08)}
/* in dark mode the page is one continuous night: sections are clear and the glow sits behind them */
html[data-theme=dark] body{background:radial-gradient(1100px 700px at 15% 25%,rgba(122,34,82,.22),transparent 70%),radial-gradient(1000px 700px at 85% 75%,rgba(70,30,90,.18),transparent 70%),#0E0B0D;background-attachment:fixed}
[data-theme=dark] .sec.tone-dark,[data-theme=dark] .sec.tone-light,[data-theme=dark] .sec.tone-white{background-color:transparent;background-image:none}
.sec.tone-light{background-image:radial-gradient(900px 520px at 10% 10%,var(--glow1),transparent 70%)}
.sec.tone-white{background-image:radial-gradient(900px 520px at 90% 20%,var(--glow2),transparent 70%)}
.sec{padding:96px 0}
.sec.join{padding-top:0}

body{font-family:var(--s);font-size:17px;line-height:1.7}
.top .w{height:72px}
.top{border-bottom-color:var(--head-line)}
.mark{font-family:var(--s);font-weight:600;font-size:16px;letter-spacing:.12em;text-transform:uppercase}
.nav{gap:34px}
.nav a{font-family:var(--s);font-size:15px;font-weight:500;border-bottom-width:1px}
.nav a[aria-current=page]{border-color:var(--head-fg)}
.mode{box-shadow:inset 0 0 0 1px var(--head-line)}
#prog{background:linear-gradient(90deg,#7E3A5E,#D6A9C0)}

/* headings: centred, airy, light with bold words */
h1{font-family:var(--d);font-weight:300;letter-spacing:.06em;line-height:1.12}
h1 strong,.sec h2 strong{font-weight:700}
.sec h2{font-family:var(--d);font-weight:300;font-size:clamp(30px,3.6vw,46px);letter-spacing:.04em;line-height:1.15;text-align:center;margin:0 auto 18px;max-width:22em}
.sec h2.sub,.sec h2.side-title{text-align:left;margin-left:0;font-weight:400;letter-spacing:.02em}
.lead2,.jlead,.years p,.years>p{text-align:center;margin-left:auto;margin-right:auto}
.lead2{margin-top:-4px;margin-bottom:44px}
.type-title{padding:84px 0 20px;text-align:center}
.type-title h1{font-size:clamp(38px,5.4vw,72px);margin-left:auto;margin-right:auto;max-width:16em}
.type-title .lead{margin:0 auto 40px;text-align:center;font-size:19px}

/* buttons: white pills on dark, ink pills on light */
.btn{font-family:var(--s);font-weight:600;font-size:14px;letter-spacing:.06em;text-transform:uppercase;padding:13px 28px;border-radius:10px;background:var(--btn-bg);color:var(--btn-fg)}
.btn.ghost,.btn.outline{background:var(--surface);color:var(--fg);box-shadow:inset 0 0 0 1px var(--glass-line);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px)}
.btn.ghost:hover,.btn.outline:hover{box-shadow:inset 0 0 0 1px var(--line2)}
.btn.deep{background:var(--btn-bg);color:var(--btn-fg)}

/* glass surfaces */
.card,.xp article,.badge,.area,.vc-back{border-radius:16px}
.card,.xp article,.badge,.area{background:var(--surface);box-shadow:inset 0 0 0 1px var(--glass-line);-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px)}
.card:hover{box-shadow:inset 0 0 0 1px var(--line2),0 24px 40px -28px var(--shadow)}
.xp article::before{display:none}
.tag{background:transparent;box-shadow:inset 0 0 0 1px var(--line2);font-family:var(--s)}
.badge time,.proj-tag,.card .org,.card .meta b,.clist time,.area b small,.vc-deg{color:var(--acc)}
.badge b,.xp h3,.card h3,.three h3,.proj h3,.role h3,.clist b{font-family:var(--d);letter-spacing:.02em}

/* centred opening */
.type-hero{padding:0;min-height:calc(100vh - 72px);display:flex;align-items:center;position:relative;overflow:hidden;isolation:isolate}
.type-hero>.w{width:100%}
.type-hero::before{content:"";position:absolute;inset:0;z-index:0;pointer-events:none;background:radial-gradient(800px 520px at 30% 30%,rgba(126,58,94,.35),transparent 70%),radial-gradient(700px 500px at 80% 70%,rgba(80,30,90,.22),transparent 70%);transform:none;-webkit-mask-image:none;mask-image:none;animation:night 22s ease-in-out infinite alternate;background-size:auto;height:auto;left:0;right:0;bottom:0}
.type-hero::after{display:none}
@keyframes night{0%{transform:translate(0,0)}100%{transform:translate(-40px,30px) scale(1.08)}}
html:not([data-theme=dark]) .type-hero.tone-dark{--bg:#140D11}
.hero2{position:relative;text-align:center;padding:90px 0 110px}
.hero2-in{position:relative;z-index:2;max-width:980px;margin:0 auto}
.eyebrow{font-family:var(--d);font-size:clamp(13px,1.3vw,17px);font-weight:400;letter-spacing:.22em;text-transform:uppercase;color:var(--soft);margin:0 0 26px}
.hero2 h1{font-size:clamp(34px,5.2vw,66px);letter-spacing:.08em;margin:0 0 28px;color:var(--strong)}
.hero2 .sub{font-family:var(--s);font-weight:400;letter-spacing:0;font-size:clamp(17px,1.5vw,20px);line-height:1.7;max-width:40em;margin:0 auto 26px;color:var(--soft)}
.hero2 .who{display:flex;flex-wrap:wrap;justify-content:center;gap:4px 18px;font-size:15px;color:var(--soft);margin:0 0 34px}
.hero2 .who b{color:var(--fg);font-weight:700}
.hero2 .who span+span::before,.hero2 .who b+span::before{content:"";display:inline-block;width:4px;height:4px;border-radius:50%;background:var(--acc);margin:0 14px 0 0;vertical-align:middle}
.hero2 .acts{justify-content:center}
.scrollhint{position:absolute;left:0;bottom:30px;font-size:14px;color:var(--soft);letter-spacing:.04em}
.scrollhint::after{content:"";display:inline-block;width:40px;height:1px;background:var(--soft);margin-left:12px;vertical-align:middle;animation:hint 2.4s ease-in-out infinite}
@keyframes hint{0%,100%{transform:scaleX(.3);transform-origin:0 50%}50%{transform:scaleX(1)}}
/* the glass shape behind the headline */
.glass{position:absolute;left:50%;top:50%;width:min(560px,80vw);aspect-ratio:1;transform:translate(-50%,-52%);z-index:1;perspective:1200px;pointer-events:none;animation:none;margin:0}
.glass .tilt{position:absolute;inset:0;transform-style:preserve-3d;animation:spin 26s ease-in-out infinite alternate}
.glass i{position:absolute;border-radius:22%;background:linear-gradient(135deg,rgba(255,255,255,.13),rgba(255,255,255,.02) 55%,rgba(214,169,192,.06));box-shadow:inset 0 0 0 1px rgba(255,255,255,.07),0 40px 80px -40px rgba(0,0,0,.7);-webkit-backdrop-filter:blur(2px);backdrop-filter:blur(2px)}
.glass .g1{inset:14% 30% 14% 6%;transform:rotate(45deg) translateZ(40px)}
.glass .g2{inset:14% 6% 14% 30%;transform:rotate(45deg) translateZ(-30px)}
.glass .g3{inset:38% 38% 38% 38%;border-radius:50%;background:radial-gradient(circle,rgba(214,169,192,.35),transparent 70%);box-shadow:none;transform:translateZ(80px);filter:blur(14px)}
@keyframes spin{0%{transform:rotateX(14deg) rotateY(-18deg)}100%{transform:rotateX(-10deg) rotateY(20deg)}}
html:not([data-theme=dark]) .glass i{background:linear-gradient(135deg,rgba(255,255,255,.16),rgba(255,255,255,.03) 55%,rgba(214,169,192,.08))}

.type-hero .glass{animation:none;margin:0;width:min(560px,80vw);order:0}
.proj-pic.depth{width:100%;margin:0}
/* meet the person */
.meet-h{margin-bottom:56px}
.meet{display:grid;grid-template-columns:minmax(0,.8fr) minmax(0,1.2fr);gap:64px;align-items:center;max-width:980px;margin:0 auto}
.meet-pic{width:100%;margin:0}
.meet-pic .rotbox{aspect-ratio:4/5;border-radius:18px;background:var(--media);box-shadow:0 50px 80px -40px var(--shadow),inset 0 0 0 1px var(--glass-line)}
.meet-text p{margin:0 0 16px;font-size:17.5px;color:var(--fg)}
.meet-text p.hey{font-family:var(--d);font-weight:700;font-size:30px;letter-spacing:.03em;margin-bottom:12px}
.meet-text p.motto{font-family:var(--d);font-weight:700;font-size:20px;letter-spacing:.02em;margin-top:22px;color:var(--strong)}
.meet-sig{display:flex;flex-direction:column;gap:2px;margin-top:26px!important;padding-top:18px;border-top:1px solid var(--line)}
.meet-sig b{font-family:var(--d);font-size:19px;letter-spacing:.03em}
.meet-sig span{font-size:15px;color:var(--acc)}

/* projects with photos */
.projects{border-top:1px solid var(--line)}
.proj{display:block}
.proj .proj-body{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,2fr);gap:20px 48px}
.proj.has-pic{display:grid;grid-template-columns:minmax(0,1.05fr) minmax(0,1fr);gap:56px;align-items:start;padding:56px 0}
.proj.has-pic.flip .proj-pic{order:2}
.proj.has-pic .proj-body{display:block}
.proj.has-pic header{margin-bottom:22px}
.proj.has-pic h3{font-size:30px}
.proj-pic{position:sticky;top:96px;margin:0}
.proj-pic .rotbox{aspect-ratio:16/11;border-radius:16px;background:var(--media);box-shadow:0 40px 70px -40px var(--shadow),inset 0 0 0 1px var(--glass-line)}
.proj-pic figcaption{font-size:13px;color:var(--soft);margin-top:10px}
.proj dt{font-family:var(--s);font-weight:700}
.proj dd{font-size:16.5px}
.proj .res dd{font-family:var(--s)}

/* other blocks */
.nums div+div{border-left-color:var(--line)}
.nums b{font-family:var(--d);font-weight:700;letter-spacing:.01em}
.nums strong{font-family:var(--d);letter-spacing:.02em}
.career-n{font-family:var(--d)}
.three{text-align:left}
.ticker span{font-family:var(--s);letter-spacing:.14em;font-weight:600}
.ticker span::after{background:var(--acc)}
.stage{border-radius:18px}
.stage figcaption small{color:#E2C3D3}
.cta{text-align:left}
.reach{font-family:var(--s)}
.vc-front{background:linear-gradient(135deg,#1E1218,#0E0B0D);box-shadow:inset 0 0 0 1px rgba(214,169,192,.35),0 34px 60px -26px rgba(0,0,0,.7)}
.vc-rule{background:#D6A9C0}
.role.current>div::before,.role.current::before{background:var(--acc);box-shadow:0 0 0 5px rgba(214,169,192,.18)}
.role>div::after,.role::after{background:var(--acc)}
.role li::marker{color:var(--acc)}
.seg.cur{background:linear-gradient(180deg,#E8C9D8,#B47A98)}
.seg em{color:#140D11}
.chart3d .pk .f{fill:#B47A98}.chart3d .pk .t{fill:#E2C3D3}.chart3d .pk .s{fill:#7A3A5E}
.chart3d a:hover .f,.chart3d a:focus-visible .f{fill:#B47A98}
.chart3d a:hover .t,.chart3d a:focus-visible .t{fill:#E2C3D3}
.chart3d a:hover .s,.chart3d a:focus-visible .s{fill:#7A3A5E}
.area i::after{background:var(--acc)}
.thumbs button[aria-current=true]{box-shadow:0 0 0 2px var(--acc)}
.jump button,.chips button{font-family:var(--s)}
footer{font-family:var(--s)}
.mform input,.mform select,.mform textarea{font-family:var(--s);border-radius:10px}
.mform input:focus,.mform select:focus,.mform textarea:focus{border-color:var(--acc)}
:focus-visible{outline-color:var(--acc)}

@media(max-width:820px){
  .sec{padding:64px 0}
  .type-hero{min-height:auto}

  .mark{font-size:14px;letter-spacing:.08em}
}
@media (prefers-reduced-motion:reduce){
  .glass .tilt,.type-hero::before,.scrollhint::after{animation:none}
}

/* ---------- 3D opening (js/hero3d.js draws the doorway into the hero) */
.hero3d{position:absolute;inset:0;width:100%;height:100%;z-index:0;pointer-events:none;display:block}
.type-hero .glass{opacity:0;transition:opacity .8s}
.type-hero.nogl .glass{opacity:.7}
.type-hero::before{opacity:.75}
.hero2-in{isolation:isolate}
.hero2-in::before{content:"";position:absolute;left:50%;top:50%;width:min(1100px,120%);height:150%;transform:translate(-50%,-50%);z-index:-1;pointer-events:none;
  background:radial-gradient(closest-side,rgba(14,11,13,.7),rgba(14,11,13,.4) 55%,rgba(14,11,13,0))}
.hero2 .eyebrow{font-size:clamp(13px,1.15vw,15px);letter-spacing:.3em;color:#EAD6E1;margin:0 0 24px}
.hero2 h1{font-weight:400;letter-spacing:.05em;line-height:1.12;color:#FFF;text-shadow:0 2px 28px rgba(14,11,13,.7)}
.hero2 h1 strong{font-weight:700}
.hero2 .sub{color:#E6DAE0;max-width:35em;margin-bottom:36px;text-shadow:0 1px 16px rgba(14,11,13,.85)}
.hero2 .eyebrow{animation:rise .9s cubic-bezier(.2,.7,.2,1) .55s both}
.hero2 .sub{animation:rise 1s cubic-bezier(.2,.7,.2,1) 1.25s both}
.hero2 .acts{animation:rise 1s cubic-bezier(.2,.7,.2,1) 1.45s both}
.hero2 .scrollhint{animation:fade 1s ease 2.3s both}
.type-hero.gl .scrollhint{left:50%;transform:translateX(-50%)}
@keyframes rise{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}
@keyframes fade{from{opacity:0}to{opacity:1}}
.q .hero2 .eyebrow,.q .hero2 .sub,.q .hero2 .acts,.q .hero2 .scrollhint,.q .kin .wd>span{animation:none;opacity:1;transform:none}
html:not([data-theme=dark]) .type-hero{--strong:#fff;--soft:#D9C9D2;--fg:#F4ECF0}
.meet-sig .cur-role{color:var(--soft)!important}
.meet-text .acts{margin-top:22px}

/* ---------- photos stay still under the pointer: only a slow, slight zoom */
.tilt{transform:none!important}
.rotbox img{transition:opacity 1.2s ease,transform 1.2s cubic-bezier(.2,.7,.2,1)}
.proj-pic:hover .rotbox img,.meet-pic:hover .rotbox img,.pgrid figure:hover img{transform:scale(1.03)}
.lean::after{display:none}

/* ---------- projects, one per row (large photo, short story, Learn more) */
.pro2{border-top:0}

.pro2 .proj-body{display:block;max-width:34em}
.pro2 .proj-tag{font-family:var(--s);font-size:13px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;margin-bottom:12px}
.pro2 .proj h3{font-family:var(--d);font-weight:400;font-size:clamp(26px,2.5vw,34px);letter-spacing:.03em;line-height:1.2;margin:0 0 18px}

.pmore{margin-top:18px}

.pgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px}

@media(max-width:820px){

<script>
// Everything on this page comes from the content feed: the admin panel writes it,
// the Apps Script web app serves it, and data.json is a recent copy for a fast first paint.
var FEED = 'https://script.google.com/macros/s/AKfycbzWSjYxyV9uwzzUYLCOJSlAuK-STLZxU6yNzZ8cM9NR39qGfdW8mHBgnnc5yWqAKKHT/exec?format=json';
var MON = {jan:1,feb:2,mar:3,apr:4,may:5,jun:6,jul:7,aug:8,sep:9,oct:10,nov:11,dec:12};
var MN = ['','Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
var F = null, DATA = [], cats = ['Highlights'], st = {cat: 'Highlights', year: 0, q: ''};
// the achievement record is sorted into eight areas; the journal's own category is only a hint
var GROUPS = ['Operations', 'Administration', 'Procurement', 'Project management', 'Digital transformation', 'Leadership', 'Technical development', 'Professional development'];
function grp(d){
  var a = String(d.ach || '').toLowerCase(), c = String(d.cat || '').toLowerCase().trim();
  if (/appointed|founding member|helped build|transform|fundrais|donation|best employee/.test(a)) return GROUPS[5];
  if (/^(led|delivered|organised) .*\b(session|training)\b/.test(a)) return GROUPS[5];
  if (/construction|mosque/.test(a)) return GROUPS[3];
  if (/\berp\b/.test(a)) return GROUPS[4];
  if (/procure|comparative statement|vendor|purchas|supplier|audit firm/.test(a)) return GROUPS[2];
  var learning = c === 'linguistics' || c === 'personal education' || /^(certified|achieved level|earned|started (an? )?arabic|completed (a|the) (full-day |two-year )?(workshop|programme|islamic))|certificat|fundamentals|workshop|diploma|degree|b\.sc|thesis|paper|research|abstract|lecture deck|codebook|agenda and session|guidelines|competency|\((google|cisco|pstu|who|ndg|ndg\/cisco|iiuc|bteb|univ\. of london)\)/.test(a);
  if (learning) return (c === 'technical' || /automation|network|linux|cyber|python|splunk|routing|server|security|data center|sensor|electricity|infosec|computer office|digital marketing/.test(a)) ? GROUPS[6] : GROUPS[7];
  if (/digital|dashboard|data app|directory|automat|\berp\b|entry sheet|tracking system|accounting system/.test(a)) return GROUPS[4];
  if (c === 'technical') return GROUPS[6];
  if (/event|programme|project/.test(a) || c === 'project management') return GROUPS[3];
  if (c === 'administration' || /kpi|salary|hiring|policy|recruit/.test(a)) return GROUPS[1];
  if (c === 'leadership' || c === 'entrepreneurship') return GROUPS[5];
  return GROUPS[0];
}
var PAGES = [], HOME = 'home', RECPAGE = null, animated = false, live = false, rotTimer = null, showTimer = null, counted = false, SIG = '';
var REDUCE = !!(window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches);

function $(id){ return document.getElementById(id); }
function esc(s){ return String(s == null ? '' : s).replace(/[&<>"]/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]; }); }
function parts(s){ return String(s || '').split(/[,\n]/).map(function(x){ return x.trim(); }).filter(Boolean); }
function lines(s){ return String(s || '').split(/\n/).map(function(x){ return x.trim(); }).filter(Boolean); }
function cells(line){ return line.split('|').map(function(x){ return x.trim(); }); }
// gallery groups, chosen by a tag in the photo library
var PCATS = [['projects', 'Project and construction coordination'], ['leadership', 'Leadership and meetings'], ['training', 'Training, programmes and conferences'], ['stakeholders', 'Stakeholder engagement'], ['team', 'Team and community']];
function pcat(p){ for (var k = 0; k < PCATS.length; k++) if ((p.tags || []).indexOf(PCATS[k][0]) > -1) return {k: k, label: PCATS[k][1]}; return {k: PCATS.length, label: ''}; }
function slug(t){ return String(t || '').toLowerCase().trim().replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, ''); }
function photos(tag){ return (F.photos || []).filter(function(p){ return (p.tags || []).indexOf(tag) > -1; }); }
function all(sel){ return [].slice.call(document.querySelectorAll(sel)); }

// ---------------------------------------------------------------- data
function prep(items){
  items.forEach(function(d){
    var m = String(d.date || '').match(/([A-Za-z]{3})[a-z]*\s+(\d{4})/);
    d.y = parseInt(d.year, 10) || (m ? +m[2] : 0);
    d.m = (m && +m[2] === d.y) ? (MON[m[1].toLowerCase()] || 0) : 0;
    d.hay = [d.ach, d.action, d.metric, d.skills, d.tools, d.org, d.cat].join(' ').toLowerCase();
  });
  return items.filter(function(d){ return d.ach; }).sort(function(a, b){ return b.y - a.y || b.m - a.m; });
}

function render(feed){
  F = feed; F.site = F.site || {}; F.sections = F.sections || []; F.photos = F.photos || [];
  DATA = prep(F.items || []);
  DATA.forEach(function(d){ d.g = grp(d); });
  cats = ['Highlights'].concat(GROUPS.filter(function(g){ return DATA.some(function(d){ return d.g === g; }); }), ['Everything']);
  PAGES = (F.pages || []).filter(function(p){ return F.sections.some(function(s){ return s.page === p.id; }); });
  if (!PAGES.length){ F = null; return failed(); }
  HOME = PAGES[0].id;
  var rec = F.sections.filter(function(s){ return s.type === 'record'; })[0];
  RECPAGE = rec ? rec.page : null;
  chrome();
  $('app').innerHTML = PAGES.map(function(p){
    return '<div class="view" id="v-' + esc(p.id) + '" hidden>' + sections(F.sections.filter(function(s){ return s.page === p.id; })) + '</div>';
  }).join('');
  orgLinks(); drawYears(); drawLatest(); drawStats(); rotation(); numbers(); slideshows(); tilts(); reveals(); motion(); onScroll();
  all('.js-jump').forEach(function(nav){
    var hs = [].slice.call(nav.closest('.view').querySelectorAll('section[data-h]'));
    nav.innerHTML = hs.length > 1 ? '<b>On this page</b>' + hs.map(function(sec){ return '<button type="button" data-jump="' + sec.id + '">' + esc(sec.getAttribute('data-h')) + '</button>'; }).join('') : '';
    if (hs.length < 2) nav.remove();
  });
  if (!QUIET) setTimeout(function(){ document.body.classList.add('settled'); }, 1600);
  show(current(), true);
  loadSystem3d();
}
// Web Settings "org_links": one line per organisation, "Name on the site | https://link".
// On the Experience page and the Education and Research parts of Profile, the first mention of each name in an organisation
// line becomes a quiet link that opens the organisation's site in a new tab.
function orgLinks(){
  var L = lines(F.site.org_links || '').map(cells).filter(function(c){ return c[0] && /^https?:\/\//.test(c[1] || ''); })
    .sort(function(a, b){ return b[0].length - a[0].length; });
  if (!L.length) return;
  all('#v-experience .role .org, #v-experience .clist span, #s-pro-edu .badge span, #s-pro-edu-extra .badge span, #s-pro-research .badge span').forEach(function(el){
    var done = {};
    L.forEach(function(c){
      if (done[c[1]]) return;
      var w = document.createTreeWalker(el, NodeFilter.SHOW_TEXT, null), n;
      while ((n = w.nextNode())){
        if (n.parentNode.closest('a')) continue;
        var i = n.nodeValue.indexOf(c[0]);
        if (i < 0) continue;
        var mid = n.splitText(i); mid.splitText(c[0].length);
        var a = document.createElement('a');
        a.className = 'olink'; a.href = c[1]; a.target = '_blank'; a.rel = 'noopener';
        a.title = 'Visit the ' + c[0] + ' website (opens in a new tab)';
        a.textContent = c[0];
        mid.parentNode.replaceChild(a, mid);
        done[c[1]] = 1;
        break;
      }
    });
  });
}
// load the 3D system model only when the page has that section, and only once
var GL = (function(){ try { var c = document.createElement('canvas'); return !!(window.WebGLRenderingContext && (c.getContext('webgl2') || c.getContext('webgl'))); } catch (e) { return false; } })();
function loadSystem3d(){
  var el = document.querySelector('.sys-stage');
  if (!el) return;
  if (!GL){ el.closest('.sys').classList.add('nogl'); return; }
  if (window.SYS3D) return window.SYS3D.mount(el);
  window._sys3d = el;
  if (document.getElementById('s3d')) return;
  var sc = document.createElement('script');
  sc.type = 'module'; sc.src = 'js/system3d.js?v=8'; sc.id = 's3d';
  sc.onerror = function(){ var x = document.querySelector('.sys'); if (x) x.classList.add('nogl'); };
  document.body.appendChild(sc);
}

function chrome(){
  var s = F.site, name = s.name || 'Sk Nayem Uddin';
  $('mark').textContent = name; $('mark').setAttribute('data-go', HOME);
  $('nav').innerHTML = PAGES.map(function(p, i){
    return '<a href="' + (i ? '#' + esc(p.id) : '#') + '" data-go="' + esc(p.id) + '"' + (i ? '' : ' class="home-link"') + '>' + esc(p.label) + '</a>';
  }).join('');
  $('foot-l').textContent = '© ' + new Date().getFullYear() + ' ' + name;
  if (s.cv_url){ $('hcv').href = s.cv_url; $('hcv').hidden = false; }
  var hh = function(){ var t = document.querySelector('.top'); if (t) document.documentElement.style.setProperty('--hh', t.offsetHeight + 'px'); };
  hh(); addEventListener('resize', hh);
  var r = [];
  if (s.email) r.push('<a href="mailto:' + esc(s.email) + '">' + esc(s.email) + '</a>');
  if (s.phone) r.push('<a href="tel:' + esc(s.phone.replace(/[^\d+]/g, '')) + '">' + esc(s.phone) + '</a>');
  $('foot-r').innerHTML = r.join(' &nbsp;|&nbsp; ');
}

function failed(){
  if (F) return;
  $('app').innerHTML = '<section class="sec tone-light"><div class="w"><h1>Sk Nayem Uddin</h1><p class="lead">This page could not load its content just now. Refresh to try again.</p></div></section>';
}

function sig(j){ var c = {}; for (var k in j) if (k !== 'updated') c[k] = j[k]; return JSON.stringify(c); }
// The first paint uses the newest copy this browser has seen (or the snapshot in data.json).
// When the live feed arrives and differs, the page is redrawn in place: same page, same scroll,
// no entrance animations, so a visitor does not see the content jump or replay.
var QUIET = false;
function take(j){
  var x = sig(j); if (x === SIG) return;
  var again = !!SIG, y = window.scrollY;
  SIG = x;
  if (again){ QUIET = true; document.body.classList.add('settled', 'q'); }
  render(j);
  if (again){ window.scrollTo(0, y); QUIET = false; }
}
function cached(){ try { var j = JSON.parse(localStorage.getItem('feed') || 'null'); return j && j.sections ? j : null; } catch (e) { return null; } }
function load(){
  var pending = 2, mine = cached();
  function miss(){ if (--pending === 0 && !F) failed(); }
  if (mine) take(mine);
  fetch('data.json', {cache: 'no-cache'}).then(function(r){ return r.ok ? r.json() : null; })
    .then(function(j){ if (j && j.sections && !live && !mine) take(j); else miss(); }).catch(miss);
  fetch(FEED).then(function(r){ return r.json(); })
    .then(function(j){
      if (!(j && j.sections)) return miss();
      live = true;
      try { localStorage.setItem('feed', JSON.stringify(j)); } catch (e) {}
      take(j);
    }).catch(miss);
}

// ---------------------------------------------------------------- sections
function sections(list){
  var out = '', prev = null, i = 0;
  while (i < list.length){
    var s = list[i];
    if (s.column === 'left' || s.column === 'right'){
      var L = [], R = [], tone = s.tone;
      while (i < list.length && (list[i].column === 'left' || list[i].column === 'right')){ (list[i].column === 'left' ? L : R).push(list[i]); i++; }
      out += wrap('cols', tone, prev, '<div class="cols"><div>' + L.map(inner).join('') + '</div><div>' + R.map(inner).join('') + '</div></div>', L[0] || R[0]);
      prev = tone; continue;
    }
    var body = inner(s);
    if (body){ out += wrap(s.type, s.tone, prev, body, s); prev = s.tone; }
    i++;
  }
  return out;
}
function wrap(type, tone, prev, body, s){
  var nav = s && s.heading && ['hero', 'intro', 'title', 'contact', 'cta', 'ticker'].indexOf(s.type) < 0;
  return '<section class="sec type-' + esc(type) + ' tone-' + esc(tone || 'light') + (prev === tone ? ' join' : '') + '"' +
    (s ? ' id="s-' + esc(s.id) + '"' : '') + (nav ? ' data-h="' + esc(plain(s.heading)) + '"' : '') + '><div class="w">' + body + '</div></section>';
}
function link(label, target, cls){
  target = target || '';
  if (target.charAt(0) === '#'){
    var id = target.slice(1) || HOME;
    return '<a class="btn ' + cls + '" href="' + (id === HOME ? '#' : esc(target)) + '" data-go="' + esc(id) + '">' + esc(label) + '</a>';
  }
  return '<a class="btn ' + cls + '" href="' + esc(target) + '" target="_blank" rel="noopener">' + esc(label) + '</a>';
}
function inner(s){
  var h = s.heading || '', b = s.body || '';
  switch (s.type){

}

    .replace(/\{years:(\d{4})-(\d{1,2})\}/g, function(_, y, m){ var t = new Date(); return Math.max(0, Math.floor(((t.getFullYear() - y) * 12 + t.getMonth() + 1 - m) / 12)); });

function numbers(){
  if (counted || REDUCE || !('IntersectionObserver' in window)){ counted = true; return; }

    }, {threshold: 0, rootMargin: '0px 0px -10% 0px'});

// ---------------------------------------------------------------- photo slideshow
function slideshows(){
  clearInterval(showTimer);
  all('.show').forEach(function(sh){
    var figs = sh.querySelectorAll('.stage figure'), thumbs = sh.querySelectorAll('.thumbs button'), count = sh.querySelector('.count');
    if (figs.length < 2) return;
    sh._i = 0;
    sh._set = function(i){
      i = (i + figs.length) % figs.length; sh._i = i;
      figs.forEach(function(f, k){ f.classList.toggle('on', k === i); });
      thumbs.forEach(function(t, k){ if (k === i) t.setAttribute('aria-current', 'true'); else t.removeAttribute('aria-current'); });
      // keep the active thumbnail in view by scrolling only the thumbnail strip, never the page
      var strip = sh.querySelector('.thumbs'), cur = thumbs[i];
      if (strip && cur && strip.scrollWidth > strip.clientWidth){
        var left = cur.offsetLeft - strip.offsetLeft, right = left + cur.offsetWidth;
        if (left < strip.scrollLeft || right > strip.scrollLeft + strip.clientWidth) strip.scrollTo({left: Math.max(0, left - 12), behavior: 'smooth'});
      }
      if (count) count.textContent = (i + 1) + ' / ' + figs.length;
    };
    sh.addEventListener('mouseenter', function(){ sh._pause = true; });
    sh.addEventListener('mouseleave', function(){ sh._pause = false; });
    var x0 = null;
    sh.addEventListener('touchstart', function(e){ x0 = e.touches[0].clientX; }, {passive: true});
    sh.addEventListener('touchend', function(e){ if (x0 === null) return; var dx = e.changedTouches[0].clientX - x0; x0 = null; if (Math.abs(dx) > 40){ sh._set(sh._i + (dx < 0 ? 1 : -1)); sh._hold = Date.now(); } });
  });
  if (REDUCE) return;
  showTimer = setInterval(function(){
    if (document.hidden) return;
    all('.show').forEach(function(sh){
      if (!sh._set || sh._pause || !sh.offsetParent || Date.now() - (sh._hold || 0) < 12000) return;
      var next = sh.querySelectorAll('.stage img')[(sh._i + 1) % sh.querySelectorAll('.stage img').length];
      if (!(next.complete && next.naturalWidth)){ next.loading = 'eager'; return; }
      sh._set(sh._i + 1);
    });
  }, 6000);
}

// ---------------------------------------------------------------- journal blocks
var YRS = null;
function drawYears(){
  var ys = DATA.map(function(d){ return d.y; }).filter(Boolean);
  if (!ys.length) return;
  var minY = Math.min.apply(null, ys), maxY = Math.max.apply(null, ys), perY = {}, peak = 1;
  ys.forEach(function(y){ perY[y] = (perY[y] || 0) + 1; if (perY[y] > peak) peak = perY[y]; });
  all('.js-count').forEach(function(el){ el.textContent = DATA.length + ' entries since ' + minY + '.' + (RECPAGE ? ' Choose a year to read it.' : ''); });
  YRS = {minY: minY, maxY: maxY, perY: perY, peak: peak};
  all('.js-bars').forEach(paintYears);
}
// a small 3D column chart: each year is a block with a front, a top and a side face
function paintYears(el){

  if (W < 280) W = 280;
  el._w = el.clientWidth || el._w;
  var narrow = W < 640, H = narrow ? 250 : 320, top = 34, floor = H - 46, slot = (W - 16) / n;
  var bw = Math.min(62, slot * .56), d = Math.min(16, bw * .42), dx = d, dy = -d * .62, room = floor - top - 28;
  var P = function(pts){ return pts.map(function(p){ return p[0].toFixed(1) + ',' + p[1].toFixed(1); }).join(' '); };
  var out = '<svg viewBox="0 0 ' + W + ' ' + H + '" width="' + W + '" height="' + H + '" role="img" aria-label="Achievements per year, ' + Y.minY + ' to ' + Y.maxY + '">' +
    '<polygon class="fl" points="' + P([[4, floor], [W - 4 - dx, floor], [W - 4, floor + dy], [4 + dx, floor + dy]]) + '"/>' +
    '<line class="base" x1="4" y1="' + floor + '" x2="' + (W - 4 - dx) + '" y2="' + floor + '"/>';
  for (var i = 0; i < n; i++){
    var y = Y.minY + i, c = Y.perY[y] || 0, x = 8 + i * slot + (slot - bw - dx) / 2, hgt = c ? Math.max(8, c / Y.peak * room) : 0, t = floor - hgt;
    var lab = (narrow && slot < 46) ? '’' + String(y).slice(2) : String(y);
    var yl = '<text class="y" x="' + (x + bw / 2).toFixed(1) + '" y="' + (floor + 26) + '" text-anchor="middle">' + lab + '<tspan font-size="0">. </tspan></text>';
    if (!c){ out += yl; continue; }
    var g = '<g class="b3' + (c === Y.peak ? ' pk' : '') + '" style="--i:' + i + '">' +
      '<polygon class="s" points="' + P([[x + bw, t], [x + bw + dx, t + dy], [x + bw + dx, floor + dy], [x + bw, floor]]) + '"/>' +
      '<rect class="f" x="' + x.toFixed(1) + '" y="' + t.toFixed(1) + '" width="' + bw.toFixed(1) + '" height="' + hgt.toFixed(1) + '"/>' +
      '<polygon class="t" points="' + P([[x, t], [x + dx, t + dy], [x + bw + dx, t + dy], [x + bw, t]]) + '"/>' +
      '<text class="n" x="' + (x + (bw + dx) / 2).toFixed(1) + '" y="' + (t + dy - 8).toFixed(1) + '" text-anchor="middle">' + c + '<tspan font-size="0"> ' + (c === 1 ? 'entry' : 'entries') + ' in </tspan></text></g>';
    out += RECPAGE ? '<a href="#' + esc(RECPAGE) + '" data-go="' + esc(RECPAGE) + '" data-year="' + y + '" aria-label="' + y + ', ' + c + (c === 1 ? ' entry' : ' entries') + '">' + g + yl + '</a>' : g + yl;
  }
  el.innerHTML = out + '</svg>';
  if (el._io) return;
  if (QUIET || REDUCE || !('IntersectionObserver' in window)){ el.classList.add('grown'); el._io = true; return; }
  el._io = new IntersectionObserver(function(es){ if (es[0].isIntersecting){ el.classList.add('grown'); el._io.disconnect(); } }, {threshold: .35});
  el._io.observe(el);
}
var rsz = null;
window.addEventListener('resize', function(){ clearTimeout(rsz); rsz = setTimeout(function(){ all('.js-bars').forEach(function(el){ if (el.offsetParent && el.clientWidth !== el._w) paintYears(el); }); }, 180); });

function drawLatest(){
  all('.js-latest').forEach(function(box){
    box.innerHTML = DATA.slice(0, +box.dataset.n || 3).map(function(d){
      var go = RECPAGE ? ' href="#' + esc(RECPAGE) + '" data-go="' + esc(RECPAGE) + '"' : '';
      var org = /^personal development$/i.test(d.org || '') ? '' : d.org;
      return '<a class="card"' + go + '><div class="meta"><b>' + esc(d.g) + '</b><span>' + (d.m ? MN[d.m] + ' ' : '') + (d.y || '') + '</span></div><h3>' + esc(d.ach) + '</h3>' +
        (d.action ? '<p>' + esc(d.action.replace(/\s+/g, ' ')) + '</p>' : '') + (org ? '<div class="org">' + esc(org) + '</div>' : '') + '</a>';
    }).join('');
  });
}
function drawRecord(){
  if (!$('list') || !DATA.length) return;
  $('chips').innerHTML = cats.map(function(c){ return '<button data-c="' + esc(c) + '" aria-pressed="' + (c === st.cat) + '">' + esc(c) + '</button>'; }).join('');
  $('yearnote').innerHTML = st.year ? '<button id="clr">Showing ' + st.year + ' only. Show every year</button>' : '';
  if ($('q').value.trim().toLowerCase() !== st.q) $('q').value = st.q;
  var inCat = function(d){ return st.cat === 'Everything' || (st.cat === 'Highlights' ? d.g !== GROUPS[6] && d.g !== GROUPS[7] && d.y >= 2023 : d.g === st.cat); };
  var rows = DATA.filter(function(d){ return inCat(d) && (!st.year || d.y === st.year) && (!st.q || d.hay.indexOf(st.q) > -1); });
  if (!rows.length){ $('list').innerHTML = '<p class="none">Nothing matches. Clear the search or choose another category.</p>'; return; }
  var html = '', cur = null, group = [];
  function flush(){ if (cur !== null) html += '<section class="yr"><h3>' + (cur || 'Undated') + '<span class="sr">: </span><small>' + group.length + (group.length === 1 ? ' entry' : ' entries') + '</small></h3><ul>' + group.join('') + '</ul></section>'; }
  rows.forEach(function(d){
    if (d.y !== cur){ flush(); cur = d.y; group = []; }
    var dl = '';
    if (d.skills) dl += '<dt>Skills</dt><dd>' + esc(parts(d.skills).join(', ')) + '</dd>';
    if (d.tools) dl += '<dt>Tools</dt><dd>' + esc(parts(d.tools).join(', ')) + '</dd>';
    if (d.org) dl += '<dt>For</dt><dd>' + esc(d.org) + '</dd>';
    group.push('<li class="entry"><button class="line" aria-expanded="false"><span class="when">' + (d.m ? MN[d.m] : '') + '</span><span class="what">' + esc(d.ach) + '</span><span class="cat">' + esc(d.g) + '</span></button><div class="more" hidden>' +
      paras(d.action) + paras(d.metric) + (dl ? '<dl>' + dl + '</dl>' : '') + '</div></li>');
  });
  flush();
  $('list').innerHTML = html;
}
function paras(t){
  var ps = String(t || '').split(/\n+/).map(function(x){ return x.trim(); }).filter(Boolean);
  if (!ps.length) return '';
  return ps.length > 1 ? '<ul class="jl">' + ps.map(function(x){ return '<li>' + esc(x) + '</li>'; }).join('') + '</ul>' : '<p>' + esc(ps[0]) + '</p>';
}
function tally(key, split){
  var o = {}, hide = parts(F.site.hide_tags).map(function(x){ return x.toLowerCase(); });
  var label = {};
  DATA.forEach(function(d){
    var seen = {};
    (split ? parts(d[key]) : [d[key]]).forEach(function(k){
      k = String(k || '').trim(); var low = k.toLowerCase();
      if (!k || hide.indexOf(low) > -1 || seen[low]) return;
      seen[low] = 1; label[low] = label[low] || k; o[low] = (o[low] || 0) + 1;
    });
  });
  return Object.keys(o).map(function(k){ return [label[k], o[k]]; }).sort(function(a, b){ return b[1] - a[1]; });
}
function meter(list){
  var max = list.length ? list[0][1] : 1;
  return list.map(function(r){ return '<div class="m"><div style="--p:' + Math.round(r[1] / max * 100) + '%">' + esc(r[0]) + '</div><b>' + r[1] + '</b></div>'; }).join('');
}
function drawStats(){
  all('.js-mcat').forEach(function(el){ el.innerHTML = meter(tally('g', false)); });
  all('.js-mskill').forEach(function(el){ el.innerHTML = tally('skills', true).slice(0, 14).map(function(r){ return '<span class="tag">' + esc(r[0]) + '</span>'; }).join(''); });
  all('.js-areas').forEach(function(el){
    var t = tally('g', false), top = t.slice(0, 8), rest = t.slice(8), max = top.length ? top[0][1] : 1;
    if (rest.length) top.push(['Other areas', rest.reduce(function(a, r){ return a + r[1]; }, 0)]);
    el.innerHTML = top.map(function(r){
      return '<div class="area"><b>' + r[1] + '<small>' + (r[1] === 1 ? 'entry' : 'entries') + '</small></b><span>' + esc(r[0]) + '</span><i style="--p:' + Math.min(100, Math.round(r[1] / max * 100)) + '%"></i></div>';
    }).join('');
  });
  all('.js-mtool').forEach(function(el){ el.innerHTML = tally('tools', true).slice(0, 16).map(function(r){ return '<span class="tag">' + esc(r[0]) + '</span>'; }).join(''); });
}

load();
