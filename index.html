<style>
:root{--pine:#0D1B2E;--pine2:#213A5C;--paper:#EEF0F4;--white:#FAFBFD;--ink:#101A2B;--mute:#566179;--brass:#C19A4B;--cel:#C7D2E2;--rule:rgba(16,26,43,.16);--d:"Bricolage Grotesque",system-ui,sans-serif;--s:"Source Serif 4",Georgia,serif}
*{box-sizing:border-box}
html{scroll-padding-top:80px}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--s);font-size:18px;line-height:1.65;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
:focus-visible{outline:2px solid var(--brass);outline-offset:3px}
.skip{position:absolute;left:-9999px;top:8px;background:var(--brass);color:var(--pine);padding:8px 14px;font-family:var(--d);z-index:20}
.skip:focus{left:8px}
.w{max-width:1120px;margin:0 auto;padding:0 28px}
.top{background:var(--pine);color:var(--white);position:sticky;top:0;z-index:10;border-bottom:1px solid rgba(199,210,226,.12)}
.top .w{display:flex;align-items:center;gap:28px;height:68px}
.mark{font-family:var(--d);font-weight:700;font-size:19px;letter-spacing:-.01em;margin-right:auto;white-space:nowrap;color:var(--white);text-decoration:none}
.nav{display:flex;gap:26px;overflow-x:auto;scrollbar-width:none}
.nav::-webkit-scrollbar{display:none}
.nav a{font-family:var(--d);font-size:15px;font-weight:500;color:var(--cel);padding:6px 0;border-bottom:2px solid transparent;white-space:nowrap;text-decoration:none}
.nav a:hover{color:var(--white)}
.nav a[aria-current=page]{color:var(--white);border-color:var(--brass)}
main{min-height:calc(100vh - 150px)}

.sec{padding:72px 0}
.sec.join{padding-top:0}
.tone-dark{background:var(--pine);color:var(--white)}
.tone-light{background:var(--paper)}
.tone-white{background:var(--white)}
.sec h2{font-family:var(--d);font-weight:700;font-size:clamp(28px,3.6vw,44px);letter-spacing:-.025em;line-height:1.05;margin:0 0 28px}
.boot{padding:120px 0;font-family:var(--d);color:var(--cel)}

.type-hero{padding:56px 0}
.hero{display:grid;grid-template-columns:1.5fr 1fr;gap:56px;align-items:center}
h1{font-family:var(--d);font-weight:700;font-size:clamp(40px,5.4vw,76px);line-height:1;letter-spacing:-.035em;margin:0 0 28px}
.hero p{font-size:21px;max-width:30em;color:var(--cel);margin:0 0 32px}
.hero p.cred{font-family:var(--d);font-weight:600;font-size:17px;color:var(--brass);margin:-14px 0 18px;letter-spacing:.01em}
.card-id{font-family:var(--d);margin:-6px 0 26px;line-height:1.4}
.card-id b{display:block;font-size:20px}
.card-id span{color:var(--pine2);font-weight:600;font-size:15px}
.ways .sep{color:var(--mute)}
.ways dd a{white-space:nowrap}
.tone-light .hero p,.tone-white .hero p{color:var(--mute)}
.acts{display:flex;gap:14px;flex-wrap:wrap}
.btn{font-family:var(--d);font-weight:600;font-size:16px;padding:13px 22px;border-radius:4px;background:var(--brass);color:var(--pine);text-decoration:none;display:inline-block;line-height:1.3}
.btn.ghost{background:none;color:var(--white);box-shadow:inset 0 0 0 1.5px var(--cel)}
.btn.deep{background:var(--pine);color:var(--white)}
.tone-dark .btn.deep{background:var(--brass);color:var(--pine)}
.btn.outline{background:none;color:var(--ink);box-shadow:inset 0 0 0 1.5px var(--ink)}
.tone-dark .btn.outline{color:var(--white);box-shadow:inset 0 0 0 1.5px var(--cel)}

.arch{position:relative;width:min(100%,340px);aspect-ratio:4/5;margin-left:auto}
.arch::before{content:"";position:absolute;inset:0;border:1.5px solid var(--brass);border-radius:999px 999px 0 0;transform:translate(-16px,-16px)}
.arch .rotbox{position:absolute;inset:0;border-radius:999px 999px 0 0;background:var(--pine2)}
.tone-light .arch .rotbox,.tone-white .arch .rotbox{background:var(--cel)}
.rotbox{position:relative;overflow:hidden}
.rotbox img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:0;transition:opacity 1.2s ease}
.rotbox img.on{opacity:1}
@media (prefers-reduced-motion:reduce){.rotbox img{transition:none}}

.years{border-top:1px solid rgba(199,210,226,.25);padding:36px 0 0}
.type-years{padding-bottom:56px}
.years h2{font-size:22px;font-weight:600;margin:0 0 4px;letter-spacing:0}
.years p{margin:0 0 28px;color:var(--cel);font-size:16px}
.tone-light .years p,.tone-white .years p{color:var(--mute)}
.bars{display:flex;align-items:flex-end;gap:10px;height:170px}
.bars button{flex:1;display:flex;flex-direction:column;justify-content:flex-end;height:100%;font-family:var(--d);font-size:13px;color:var(--cel);text-align:center;min-width:0}
.tone-light .bars button,.tone-white .bars button{color:var(--mute)}
.bars button[disabled]{cursor:default}
.bars i{display:block;background:var(--cel);border-radius:3px 3px 0 0;height:0;transition:height .9s cubic-bezier(.2,.7,.2,1)}
.tone-light .bars i,.tone-white .bars i{background:var(--pine2)}
.bars b{font-weight:600;font-size:14px;margin-bottom:6px}
.bars span{padding-top:8px;border-top:1px solid rgba(199,210,226,.25)}
.bars button:hover i,.bars button:focus-visible i{background:var(--brass)}
@media (prefers-reduced-motion:reduce){.bars i{transition:none}}

.three{display:grid;grid-template-columns:repeat(var(--n,3),1fr);row-gap:28px}
.three div{padding:0 32px;border-left:1px solid var(--rule)}
.three div:nth-child(3n+1){padding-left:0;border-left:0}
.tone-dark .three div{border-color:rgba(199,210,226,.25)}
.three h3{font-family:var(--d);font-size:21px;font-weight:600;line-height:1.2;margin:0 0 10px}
.three p{margin:0;color:var(--mute);font-size:17px}
.tone-dark .three p{color:var(--cel)}

.lead2{color:var(--mute);max-width:34em;margin:-12px 0 32px}
.tone-dark .lead2{color:var(--cel)}
.shots{display:grid;grid-template-columns:repeat(6,1fr);gap:16px}
.shots figure{margin:0;grid-column:span 2}
.shots figure.big{grid-column:span 3}
.shots img{display:block;width:100%;height:auto;aspect-ratio:4/3;object-fit:cover;border-radius:4px;background:var(--pine2)}
.shots figure.big img{aspect-ratio:3/2}
.shots figcaption{font-family:var(--d);font-size:14px;color:var(--mute);margin-top:9px;line-height:1.4}
.tone-dark .shots figcaption{color:var(--cel)}

.js-latest{list-style:none;margin:0 0 28px;padding:0;border-top:1.5px solid currentColor}
.js-latest li{border-bottom:1px solid var(--rule)}
.js-latest .line{grid-template-columns:84px 1fr auto;color:inherit;text-decoration:none}

.type-title{padding:64px 0 0}
.type-title h1{font-size:clamp(40px,6vw,80px)}
.lead{font-size:21px;max-width:34em;margin:-8px 0 44px;color:var(--mute)}
.tone-dark .lead{color:var(--cel)}
.type-record{padding-bottom:88px}

.role{display:grid;grid-template-columns:220px 1fr;gap:32px;padding:28px 0;border-top:1px solid var(--rule)}
.role time{font-family:var(--d);font-weight:500;font-size:16px;color:var(--mute);padding-top:4px}
.role h3{font-family:var(--d);font-size:24px;font-weight:600;margin:0;letter-spacing:-.01em}
.role .org{color:var(--pine2);font-style:italic;margin:2px 0 10px}
.tone-dark .role .org{color:var(--cel)}
.role p{margin:0 0 8px;max-width:38em}
.role ul{margin:8px 0 0;padding-left:20px;max-width:38em}
.role li{margin-bottom:4px}
.sub{font-family:var(--d);font-weight:700;font-size:28px;letter-spacing:-.02em;margin:0 0 20px}

.tools{display:flex;flex-wrap:wrap;gap:14px;align-items:center;margin-bottom:14px}
#q{font-family:var(--d);font-size:16px;padding:12px 14px;border:1.5px solid var(--ink);border-radius:4px;background:var(--white);color:var(--ink);width:min(100%,360px)}
#clr{font-family:var(--d);font-size:14.5px;text-decoration:underline;text-decoration-color:var(--brass);text-underline-offset:4px}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:36px}
.chips button{font-family:var(--d);font-size:14px;font-weight:500;padding:6px 13px;border-radius:99px;box-shadow:inset 0 0 0 1px var(--rule)}
.chips button[aria-pressed=true]{background:var(--pine);color:var(--white);box-shadow:none}
.yr{display:grid;grid-template-columns:150px 1fr;gap:24px;border-top:1.5px solid var(--ink);padding:18px 0 34px}
.yr>h3{font-family:var(--d);font-weight:700;font-size:54px;letter-spacing:-.04em;line-height:1;margin:0;color:var(--pine)}
.yr>h3 small{display:block;font-size:14px;font-weight:500;letter-spacing:0;color:var(--mute);margin-top:8px}
.yr ul{list-style:none;margin:0;padding:0}
.entry{border-bottom:1px solid var(--rule)}
.entry:last-child{border-bottom:0}
.line{display:grid;grid-template-columns:48px 1fr auto;gap:16px;width:100%;text-align:left;padding:13px 0;align-items:baseline}
.line .when{font-family:var(--d);font-size:14px;color:var(--mute)}
.line .what{font-size:18px;line-height:1.4}
.line .cat{font-family:var(--d);font-size:13px;color:var(--pine2);white-space:nowrap}
.line:hover .what{color:var(--pine2);text-decoration:underline;text-decoration-color:var(--brass);text-underline-offset:4px}
.more{padding:2px 0 20px 64px;max-width:44em;font-size:16.5px;color:#2b3648}
.more p{margin:0 0 10px;white-space:pre-line}
.more dl{display:grid;grid-template-columns:70px 1fr;gap:4px 12px;margin:0;font-family:var(--d);font-size:14px}
.more dt{color:var(--mute)}
.more dd{margin:0}
.none{padding:24px 0;color:var(--mute)}

.cols{display:grid;grid-template-columns:1.2fr 1fr;gap:64px}
.h3{font-family:var(--d);font-size:22px;font-weight:600;margin:0 0 12px}
.prose p{margin:0 0 18px;max-width:34em}
.pimg{margin:0 0 36px}
.pimg .rotbox{aspect-ratio:5/4;border-radius:4px;background:var(--cel)}
.pimg figcaption{font-family:var(--d);font-size:14px;color:var(--mute);margin-top:9px}
.meter{margin:0 0 36px}
.meter h3,.plain h3{font-family:var(--d);font-size:19px;font-weight:600;margin:0 0 14px}
.m{display:grid;grid-template-columns:1fr 34px;gap:10px;align-items:center;font-family:var(--d);font-size:14.5px;margin-bottom:9px}
.m div{position:relative;padding-bottom:7px}
.m div::before{content:"";position:absolute;left:0;right:0;bottom:1px;height:1px;background:var(--rule)}
.m div::after{content:"";position:absolute;left:0;bottom:0;height:3px;border-radius:2px;background:var(--pine2);width:var(--p)}
.m b{font-weight:600;text-align:right;color:var(--mute)}
.plain{border-top:1px solid var(--rule);padding-top:22px;margin-top:8px}
.plain ul{margin:0 0 28px;padding:0;list-style:none}
.plain li{padding:8px 0;border-bottom:1px solid var(--rule)}
.plain li span{display:block;font-size:15.5px;color:var(--mute)}
.plain+.plain{border-top:0;padding-top:4px}
.inline{font-family:var(--d);font-size:15px;color:var(--mute);line-height:1.8;margin:0}

.type-contact{padding:64px 0 88px}
.reachgrid{display:grid;grid-template-columns:1.4fr 1fr;gap:56px;align-items:center}
.reachgrid .arch{width:min(100%,320px)}
.reach{font-family:var(--d);font-weight:600;font-size:clamp(22px,2.6vw,32px);letter-spacing:-.02em;line-height:1.25;max-width:20em;margin:0 0 28px}
.ways{display:grid;grid-template-columns:92px 1fr;gap:12px 20px;margin:0 0 32px;font-family:var(--d);font-size:19px}
.ways dt{color:var(--mute);font-size:15px;padding-top:3px}
.ways dd{margin:0;overflow-wrap:anywhere}
.ways a{color:inherit;text-decoration:underline;text-decoration-color:var(--brass);text-decoration-thickness:1.5px;text-underline-offset:5px}
.ways a:hover{color:var(--pine2)}


/* hero: status pill and the one load moment */
.now{display:inline-flex;align-items:center;gap:10px;font-family:var(--d);font-size:14px;font-weight:500;color:var(--cel);box-shadow:inset 0 0 0 1px rgba(199,210,226,.28);border-radius:99px;padding:6px 14px 6px 12px;margin:0 0 22px}
.now i{width:8px;height:8px;border-radius:50%;background:var(--brass);animation:pulse 2.4s infinite}
.tone-light .now,.tone-white .now{color:var(--mute);box-shadow:inset 0 0 0 1px var(--rule)}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(193,154,75,.55)}70%{box-shadow:0 0 0 10px rgba(193,154,75,0)}100%{box-shadow:0 0 0 0 rgba(193,154,75,0)}}
.hero>div:first-child>*{animation:rise .9s cubic-bezier(.2,.7,.2,1) both}
.hero>div:first-child>*:nth-child(2){animation-delay:.07s}
.hero>div:first-child>*:nth-child(3){animation-delay:.14s}
.hero>div:first-child>*:nth-child(4){animation-delay:.21s}
.hero>div:first-child>*:nth-child(5){animation-delay:.28s}
.type-hero .arch{animation:arch 1.2s .15s cubic-bezier(.2,.7,.2,1) both}
@keyframes rise{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}
@keyframes arch{from{opacity:0;transform:translateY(12px) scale(.97)}to{opacity:1;transform:none}}
.settled .hero>div:first-child>*,.settled .type-hero .arch{animation:none}

/* numbers */
.type-numbers{padding-bottom:60px}
.nums{display:grid;grid-template-columns:repeat(var(--n,4),1fr);border-top:1px solid rgba(199,210,226,.25)}
.nums div{padding:30px 24px 0 0}
.nums div+div{padding-left:28px;border-left:1px solid rgba(199,210,226,.25)}
.nums b{display:block;font-family:var(--d);font-weight:700;font-size:clamp(42px,5.2vw,68px);letter-spacing:-.04em;line-height:1;color:var(--white);font-variant-numeric:tabular-nums}
.nums span{display:block;margin-top:12px;font-size:16px;line-height:1.45;color:var(--cel);max-width:15em}
.tone-light .nums,.tone-white .nums,.tone-light .nums div+div,.tone-white .nums div+div{border-color:var(--rule)}
.tone-light .nums b,.tone-white .nums b{color:var(--pine)}
.tone-light .nums span,.tone-white .nums span{color:var(--mute)}

/* skills ticker */
.type-ticker{padding:0}
.type-ticker .w{max-width:none;padding:0}
.ticker{overflow:hidden;border-top:1px solid rgba(199,210,226,.16);border-bottom:1px solid rgba(199,210,226,.16);-webkit-mask-image:linear-gradient(90deg,transparent,#000 7%,#000 93%,transparent);mask-image:linear-gradient(90deg,transparent,#000 7%,#000 93%,transparent)}
.ticker-track{display:flex;width:max-content;animation:tick var(--dur,70s) linear infinite}
.ticker:hover .ticker-track{animation-play-state:paused}
.ticker span{font-family:var(--d);font-size:15.5px;font-weight:500;color:var(--cel);padding:20px 0;white-space:nowrap}
.ticker span::after{content:"";display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--brass);margin:0 24px;vertical-align:middle}
.tone-light .ticker span,.tone-white .ticker span{color:var(--mute)}
@keyframes tick{to{transform:translateX(-50%)}}

/* photo slideshow */
.show{position:relative}
.stage{position:relative;aspect-ratio:16/8;border-radius:6px;overflow:hidden;background:var(--pine2)}
.stage figure{position:absolute;inset:0;margin:0;opacity:0;transition:opacity 1.3s ease}
.stage figure.on{opacity:1;z-index:1}
.stage img{display:block;width:100%;height:100%;object-fit:cover;transform:scale(1.001);transition:transform 8s ease-out}
.stage figure.on img{transform:scale(1.07)}
.stage figcaption{position:absolute;left:0;right:0;bottom:0;padding:64px 28px 22px;background:linear-gradient(transparent,rgba(13,27,46,.88));color:var(--white);font-family:var(--d);font-size:17px;font-weight:500;line-height:1.4}
.show-bar{display:flex;align-items:center;gap:12px;margin-top:16px}
.arrow{flex:none;width:44px;height:44px;border-radius:50%;box-shadow:inset 0 0 0 1.5px rgba(199,210,226,.45);color:var(--white);font-size:18px;display:grid;place-items:center;transition:background .2s}
.arrow:hover{background:rgba(199,210,226,.12)}
.thumbs{display:flex;gap:10px;flex:1;overflow-x:auto;padding:3px;scrollbar-width:none}
.thumbs::-webkit-scrollbar{display:none}
.thumbs button{flex:0 0 96px;height:62px;border-radius:4px;overflow:hidden;opacity:.45;transition:opacity .3s,box-shadow .3s}
.thumbs button:hover{opacity:.8}
.thumbs button[aria-current=true]{opacity:1;box-shadow:0 0 0 2px var(--brass)}
.thumbs img{width:100%;height:100%;object-fit:cover;display:block}
.count{flex:none;font-family:var(--d);font-size:14px;color:var(--cel);min-width:52px;text-align:right;font-variant-numeric:tabular-nums}
.tone-light .arrow,.tone-white .arrow{color:var(--ink);box-shadow:inset 0 0 0 1.5px var(--rule)}
.tone-light .count,.tone-white .count{color:var(--mute)}

/* recent work cards */
.cards{display:grid;grid-template-columns:repeat(3,1fr);gap:18px;margin-bottom:30px}
.card{display:flex;flex-direction:column;gap:12px;padding:24px;border-radius:6px;background:var(--paper);box-shadow:inset 0 0 0 1px var(--rule);color:inherit;text-decoration:none;transition:box-shadow .25s,transform .25s}
.tone-light .card{background:var(--white)}
.card:hover{box-shadow:inset 0 0 0 1.5px var(--pine2);transform:translateY(-3px)}
.card .meta{display:flex;justify-content:space-between;gap:10px;font-family:var(--d);font-size:13px;color:var(--mute)}
.card .meta b{color:var(--pine2);font-weight:600}
.card h3{font-family:var(--s);font-weight:600;font-size:19px;line-height:1.35;margin:0}
.card p{margin:0;font-size:15.5px;color:var(--mute);line-height:1.55;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.card .org{margin-top:auto;padding-top:6px;font-family:var(--d);font-size:13px;color:var(--pine2)}

/* closing band */
.type-cta{padding:80px 0}
.cta{display:grid;grid-template-columns:1.5fr auto;gap:36px;align-items:end}
.cta h2{margin-bottom:12px}
.cta p{color:var(--cel);margin:0;max-width:32em;font-size:19px}
.tone-light .cta p,.tone-white .cta p{color:var(--mute)}

@media(max-width:820px){
  .nums{grid-template-columns:1fr 1fr}
  .nums div,.nums div+div{padding:24px 12px 0 0;border-left:0}
  .nums div:nth-child(n+3){border-top:1px solid rgba(199,210,226,.18);margin-top:24px}
  .stage{aspect-ratio:4/3}
  .thumbs{display:none}
  .show-bar{justify-content:flex-start}
  .cards{grid-template-columns:1fr}
  .cta{grid-template-columns:1fr}
}
@media (prefers-reduced-motion:reduce){
  .hero>div:first-child>*,.type-hero .arch,.now i{animation:none}
  .ticker-track{animation:none;flex-wrap:wrap;width:auto}
  .stage figure,.stage img{transition:none}
  .stage figure.on img{transform:none}
}

/* profile header */
.type-intro{padding:64px 0 76px}
.intro{display:grid;grid-template-columns:1.35fr 1fr;gap:64px;align-items:center}
.intro h1{font-size:clamp(40px,5.6vw,72px);margin:0 0 14px}
.intro .cred{font-family:var(--d);font-weight:600;font-size:17px;color:var(--brass);margin:0 0 22px}
.intro-lead{font-size:20px;line-height:1.6;max-width:32em;margin:0 0 30px;color:var(--cel)}
.tone-light .intro-lead,.tone-white .intro-lead{color:var(--mute)}
.facts{display:grid;grid-template-columns:1fr 1fr;gap:18px 32px;margin:0 0 34px;padding-top:24px;border-top:1px solid rgba(199,210,226,.25)}
.tone-light .facts,.tone-white .facts{border-color:var(--rule)}
.facts dt{font-family:var(--d);font-size:13px;color:var(--cel);margin-bottom:3px}
.tone-light .facts dt,.tone-white .facts dt{color:var(--mute)}
.facts dd{margin:0;font-family:var(--d);font-weight:600;font-size:16.5px;line-height:1.35}
.frame{position:relative;width:min(100%,380px);aspect-ratio:4/5;margin-left:auto}
.frame::before{content:"";position:absolute;inset:0;border:1.5px solid var(--brass);border-radius:6px;transform:translate(18px,18px)}
.frame .rotbox{position:absolute;inset:0;border-radius:6px;background:var(--pine2)}
.type-intro .intro>div:first-child>*{animation:rise .9s cubic-bezier(.2,.7,.2,1) both}
.type-intro .intro>div:first-child>*:nth-child(2){animation-delay:.07s}
.type-intro .intro>div:first-child>*:nth-child(3){animation-delay:.14s}
.type-intro .intro>div:first-child>*:nth-child(4){animation-delay:.21s}
.type-intro .intro>div:first-child>*:nth-child(5){animation-delay:.28s}
.type-intro .frame{animation:arch 1.2s .15s cubic-bezier(.2,.7,.2,1) both}
.settled .type-intro .intro>div:first-child>*,.settled .type-intro .frame{animation:none}

/* expertise cards */
.xp{display:grid;grid-template-columns:repeat(3,1fr);gap:18px}
.xp article{position:relative;overflow:hidden;padding:26px 24px 28px;border-radius:6px;background:var(--paper);box-shadow:inset 0 0 0 1px var(--rule)}
.tone-light .xp article{background:var(--white)}
.xp article::before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--brass);transform:scaleY(.3);transform-origin:top;transition:transform .4s ease}
.xp article:hover::before{transform:none}
.xp h3{font-family:var(--d);font-size:20px;font-weight:600;letter-spacing:-.01em;margin:0 0 16px}
.tags{display:flex;flex-wrap:wrap;gap:8px}
.tag{font-family:var(--d);font-size:13.5px;font-weight:500;line-height:1.3;padding:6px 11px;border-radius:99px;background:var(--white);box-shadow:inset 0 0 0 1px var(--rule);color:var(--ink)}
.tone-light .tag{background:var(--paper)}
.tone-white .xp .tag{background:var(--white)}

/* credential cards */
.badges{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
.badge{display:grid;grid-template-columns:1fr auto;align-content:start;gap:6px 14px;padding:18px 20px;border-radius:6px;background:var(--white);box-shadow:inset 0 0 0 1px var(--rule)}
.tone-white .badge{background:var(--paper)}
.tone-dark .badge{background:rgba(199,210,226,.06);box-shadow:inset 0 0 0 1px rgba(199,210,226,.22)}
.badge b{font-family:var(--d);font-weight:600;font-size:16.5px;line-height:1.3}
.badge span{grid-column:1;font-size:14.5px;line-height:1.45;color:var(--mute)}
.tone-dark .badge span{color:var(--cel)}
.badge time{grid-row:1;grid-column:2;font-family:var(--d);font-size:13px;font-weight:600;color:var(--brass);white-space:nowrap;padding-top:2px}
.badges.two{grid-template-columns:repeat(2,1fr)}

@media(max-width:820px){
  .intro{grid-template-columns:1fr;gap:36px}
  .intro .frame{order:-1;margin:0;width:230px}
  .xp,.badges,.badges.two{grid-template-columns:1fr}
}
@media (prefers-reduced-motion:reduce){.type-intro .intro>div:first-child>*,.type-intro .frame{animation:none}}

footer{background:var(--pine);color:var(--cel);font-family:var(--d);font-size:14px;padding:26px 0}
footer .w{display:flex;justify-content:space-between;gap:10px 24px;flex-wrap:wrap}
footer a{color:var(--white);text-decoration:none}
footer a:hover{text-decoration:underline}

@media(max-width:820px){
  body{font-size:17px}
  .top .w{height:auto;flex-direction:column;align-items:flex-start;gap:6px;padding-top:14px;padding-bottom:8px}
  .nav{width:100%;gap:18px}
  .nav a.home-link{display:none}
  .sec{padding:52px 0}
  .sec.join{padding-top:0}
  .hero{grid-template-columns:1fr;gap:36px}
  .hero .arch{margin:16px 0 0 16px;width:220px;order:-1}
  .bars{gap:5px}.bars button{font-size:11px}
  .three{grid-template-columns:1fr}
  .three div{padding:20px 0;border-left:0;border-top:1px solid var(--rule)}
  .three div:first-child{border-top:0;padding-top:0}
  .shots{grid-template-columns:1fr 1fr;gap:10px}
  .shots figure,.shots figure.big{grid-column:span 1}
  .shots figure.big:first-child{grid-column:span 2}
  .js-latest .line{grid-template-columns:72px 1fr}
  .role{grid-template-columns:1fr;gap:4px}
  .yr{grid-template-columns:1fr;gap:8px}.yr>h3{font-size:40px}
  .line{grid-template-columns:40px 1fr}.line .cat{display:none}
  .more{padding-left:56px}
  .cols{grid-template-columns:1fr;gap:32px}
  .reachgrid{grid-template-columns:1fr;gap:36px}
  .reachgrid .arch{order:2;margin:16px 0 0 16px;width:240px}
  .ways{grid-template-columns:72px 1fr;gap:10px 14px;font-size:17px}
  .ways dt{font-size:14px}
}
</style>
</head>
<body>
<a class="skip" href="#main">Skip to content</a>
<header class="top"><div class="w">
  <a class="mark" id="mark" href="#">Sk Nayem Uddin</a>
  <nav class="nav" id="nav" aria-label="Pages"></nav>
</div></header>
<main id="main"><div id="app"><section class="sec tone-dark boot"><div class="w">Loading…</div></section></div></main>
<footer><div class="w"><span id="foot-l">Sk Nayem Uddin</span><span id="foot-r"></span></div></footer>

<script>
// Everything on this page comes from the content feed: the admin panel writes it,
// the Apps Script web app serves it, and data.json is a recent copy for a fast first paint.
var FEED = 'https://script.google.com/macros/s/AKfycbzWSjYxyV9uwzzUYLCOJSlAuK-STLZxU6yNzZ8cM9NR39qGfdW8mHBgnnc5yWqAKKHT/exec?format=json';
var MON = {jan:1,feb:2,mar:3,apr:4,may:5,jun:6,jul:7,aug:8,sep:9,oct:10,nov:11,dec:12};
var MN = ['','Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
var F = null, DATA = [], cats = ['All'], st = {cat: 'All', year: 0, q: ''};
var PAGES = [], HOME = 'home', RECPAGE = null, animated = false, live = false, rotTimer = null, showTimer = null, counted = false, SIG = '';
var REDUCE = !!(window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches);

function $(id){ return document.getElementById(id); }
function esc(s){ return String(s == null ? '' : s).replace(/[&<>"]/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]; }); }
function parts(s){ return String(s || '').split(/[,\n]/).map(function(x){ return x.trim(); }).filter(Boolean); }
function lines(s){ return String(s || '').split(/\n/).map(function(x){ return x.trim(); }).filter(Boolean); }
function cells(line){ return line.split('|').map(function(x){ return x.trim(); }); }
function photos(tag){ return (F.photos || []).filter(function(p){ return (p.tags || []).indexOf(tag) > -1; }); }
function all(sel){ return [].slice.call(document.querySelectorAll(sel)); }

// ---------------------------------------------------------------- data
function prep(items){
  items.forEach(function(d){
    var m = String(d.date || '').match(/([A-Za-z]{3})[a-z]*\s+(\d{4})/);
    d.y = parseInt(d.year, 10) || (m ? +m[2] : 0);
    d.m = (m && +m[2] === d.y) ? (MON[m[1].toLowerCase()] || 0) : 0;
    d.hay = [d.ach, d.action, d.metric, d.skills, d.tools, d.org, d.cat].join(' ').toLowerCase();
  });
  return items.filter(function(d){ return d.ach; }).sort(function(a, b){ return b.y - a.y || b.m - a.m; });
}

function render(feed){
  F = feed; F.site = F.site || {}; F.sections = F.sections || []; F.photos = F.photos || [];
  DATA = prep(F.items || []);
  cats = ['All'].concat(DATA.map(function(d){ return d.cat; }).filter(function(c, i, a){ return c && a.indexOf(c) === i; }).sort());
  PAGES = (F.pages || []).filter(function(p){ return F.sections.some(function(s){ return s.page === p.id; }); });
  if (!PAGES.length){ F = null; return failed(); }
  HOME = PAGES[0].id;
  var rec = F.sections.filter(function(s){ return s.type === 'record'; })[0];
  RECPAGE = rec ? rec.page : null;
  chrome();
  $('app').innerHTML = PAGES.map(function(p){
    return '<div class="view" id="v-' + esc(p.id) + '" hidden>' + sections(F.sections.filter(function(s){ return s.page === p.id; })) + '</div>';
  }).join('');
  drawYears(); drawLatest(); drawStats(); rotation(); numbers(); slideshows();
  setTimeout(function(){ document.body.classList.add('settled'); }, 1600);
  show(current(), true);
}

function chrome(){
  var s = F.site, name = s.name || 'Sk Nayem Uddin';
  $('mark').textContent = name; $('mark').setAttribute('data-go', HOME);
  $('nav').innerHTML = PAGES.map(function(p, i){
    return '<a href="' + (i ? '#' + esc(p.id) : '#') + '" data-go="' + esc(p.id) + '"' + (i ? '' : ' class="home-link"') + '>' + esc(p.label) + '</a>';
  }).join('');
  $('foot-l').textContent = '© ' + new Date().getFullYear() + ' ' + name;
  var r = [];
  if (s.email) r.push('<a href="mailto:' + esc(s.email) + '">' + esc(s.email) + '</a>');
  if (s.phone) r.push('<a href="tel:' + esc(s.phone.replace(/[^\d+]/g, '')) + '">' + esc(s.phone) + '</a>');
  $('foot-r').innerHTML = r.join(' &nbsp;|&nbsp; ');
}

function failed(){
  if (F) return;
  $('app').innerHTML = '<section class="sec tone-light"><div class="w"><h1>Sk Nayem Uddin</h1><p class="lead">This page could not load its content just now. Refresh to try again.</p></div></section>';
}

function sig(j){ var c = {}; for (var k in j) if (k !== 'updated') c[k] = j[k]; return JSON.stringify(c); }
function take(j){ var x = sig(j); if (x === SIG) return; SIG = x; render(j); }
function load(){
  var pending = 2;
  function miss(){ if (--pending === 0 && !F) failed(); }
  fetch('data.json', {cache: 'no-cache'}).then(function(r){ return r.ok ? r.json() : null; })
    .then(function(j){ if (j && j.sections && !live) take(j); else miss(); }).catch(miss);
  fetch(FEED).then(function(r){ return r.json(); })
    .then(function(j){ if (j && j.sections){ live = true; take(j); } else miss(); }).catch(miss);
}

// ---------------------------------------------------------------- sections
function sections(list){
  var out = '', prev = null, i = 0;
  while (i < list.length){
    var s = list[i];
    if (s.column === 'left' || s.column === 'right'){
      var L = [], R = [], tone = s.tone;
      while (i < list.length && (list[i].column === 'left' || list[i].column === 'right')){ (list[i].column === 'left' ? L : R).push(list[i]); i++; }
      out += wrap('cols', tone, prev, '<div class="cols"><div>' + L.map(inner).join('') + '</div><div>' + R.map(inner).join('') + '</div></div>');
      prev = tone; continue;
    }
    var body = inner(s);
    if (body){ out += wrap(s.type, s.tone, prev, body); prev = s.tone; }
    i++;
  }
  return out;
}
function wrap(type, tone, prev, body){
  return '<section class="sec type-' + esc(type) + ' tone-' + esc(tone || 'light') + (prev === tone ? ' join' : '') + '"><div class="w">' + body + '</div></section>';
}
function link(label, target, cls){
  target = target || '';
  if (target.charAt(0) === '#'){
    var id = target.slice(1) || HOME;
    return '<a class="btn ' + cls + '" href="' + (id === HOME ? '#' : esc(target)) + '" data-go="' + esc(id) + '">' + esc(label) + '</a>';
  }
  return '<a class="btn ' + cls + '" href="' + esc(target) + '" target="_blank" rel="noopener">' + esc(label) + '</a>';
}
function inner(s){
  var h = s.heading || '', b = s.body || '';
  switch (s.type){
    case 'hero':
      var btns = lines(s.items).map(function(l, i){ var c = cells(l); return link(c[0], c[1], i ? (s.tone === 'dark' ? 'ghost' : 'outline') : ''); }).join('');
      var cred = [F.site.name, F.site.degrees].filter(Boolean).join(' · ');
      return '<div class="hero"><div>' + (F.site.current ? '<p class="now"><i></i>' + esc(F.site.current) + '</p>' : '') + '<h1>' + esc(h) + '</h1>' + (cred ? '<p class="cred">' + esc(cred) + '</p>' : '') + (b ? '<p>' + esc(b) + '</p>' : '') + (btns ? '<div class="acts">' + btns + '</div>' : '') + '</div>' +
        '<div class="arch"><div class="rotbox" data-tag="portrait"></div></div></div>';
    case 'years':
      return '<div class="years"><h2>' + esc(h) + '</h2><p class="js-count"></p><div class="bars js-bars"></div></div>';
    case 'latest':
      return (h ? '<h2>' + esc(h) + '</h2>' : '') + '<div class="cards js-latest" data-n="' + (parseInt(b, 10) || 3) + '"></div>' +
        (RECPAGE ? '<a class="btn deep" href="#' + esc(RECPAGE) + '" data-go="' + esc(RECPAGE) + '">See every entry</a>' : '');
    case 'record':
      return '<div class="tools"><input id="q" type="search" placeholder="Search entries, skills or tools" aria-label="Search the record"><span id="yearnote"></span></div><div class="chips" id="chips"></div><div id="list"></div>';
    case 'stats':
      var want = (b || 'areas, skills, tools').toLowerCase();
      return (h ? '<h3 class="h3">' + esc(h) + '</h3>' : '') +
        (want.indexOf('areas') > -1 ? '<div class="meter"><h3>Where the work has been</h3><div class="js-mcat"></div></div>' : '') +
        (want.indexOf('skills') > -1 ? '<div class="meter"><h3>Skills used most often</h3><div class="js-mskill"></div></div>' : '') +
        (want.indexOf('tools') > -1 ? '<div class="meter"><h3>Tools I use</h3><div class="tags js-mtool"></div></div>' : '');
    case 'title':
      return '<h1>' + esc(h) + '</h1>' + (b ? '<p class="lead">' + esc(b) + '</p>' : '');
    case 'text':
      return (h ? '<h3 class="h3">' + esc(h) + '</h3>' : '') + '<div class="prose">' + String(b).split(/\n\s*\n/).filter(function(p){ return p.trim(); }).map(function(p){ return '<p>' + esc(p.trim()).replace(/\n/g, '<br>') + '</p>'; }).join('') + '</div>';
    case 'columns':
      var cols = lines(s.items);
      return (h ? '<h2>' + esc(h) + '</h2>' : '') + '<div class="three" style="--n:' + Math.min(3, cols.length || 1) + '">' + cols.map(function(l){ var c = cells(l); return '<div><h3>' + esc(c[0]) + '</h3>' + (c[1] ? '<p>' + esc(c[1]) + '</p>' : '') + '</div>'; }).join('') + '</div>';
    case 'list':
      return '<div class="plain">' + (h ? '<h3>' + esc(h) + '</h3>' : '') + '<ul>' + lines(s.items).map(function(l){ var c = cells(l); return '<li>' + esc(c[0]) + (c[1] ? '<span>' + esc(c[1]) + '</span>' : '') + '</li>'; }).join('') + '</ul></div>';
    case 'roles':
      return (h ? '<h2 class="sub">' + esc(h) + '</h2>' : '') + lines(s.items).map(function(l){
        var c = cells(l), pts = (c[4] || '').split(';').map(function(x){ return x.trim(); }).filter(Boolean);
        return '<div class="role"><time>' + esc(c[0]) + '</time><div><h3>' + esc(c[1]) + '</h3>' + (c[2] ? '<div class="org">' + esc(c[2]) + '</div>' : '') +
          (c[3] ? '<p>' + esc(c[3]) + '</p>' : '') + (pts.length ? '<ul>' + pts.map(function(p){ return '<li>' + esc(p) + '</li>'; }).join('') + '</ul>' : '') + '</div></div>';
      }).join('');
    case 'gallery':
      var g = photos('gallery');
      if (!g.length) return '';
      return (h ? '<h2>' + esc(h) + '</h2>' : '') + (b ? '<p class="lead2">' + esc(b) + '</p>' : '') +
        '<div class="show" aria-roledescription="carousel" aria-label="' + esc(h || 'Photos') + '"><div class="stage">' + g.map(function(p, i){
          return '<figure' + (i ? '' : ' class="on"') + '><img src="' + esc(p.url) + '"' + (i > 1 ? ' loading="lazy"' : '') + ' alt="' + esc(p.caption || 'Photo') + '" style="object-position:' + esc(p.position || '50% 50%') + '">' +
            (p.caption ? '<figcaption>' + esc(p.caption) + '</figcaption>' : '') + '</figure>';
        }).join('') + '</div>' +
        (g.length > 1 ? '<div class="show-bar"><button class="arrow" data-show="-1" aria-label="Previous photo">&larr;</button><button class="arrow" data-show="1" aria-label="Next photo">&rarr;</button><div class="thumbs">' +
          g.map(function(p, i){ return '<button data-show-to="' + i + '" aria-label="Show photo ' + (i + 1) + '"' + (i ? '' : ' aria-current="true"') + '><img src="' + esc(p.url) + '" loading="lazy" alt=""></button>'; }).join('') +
          '</div><span class="count">1 / ' + g.length + '</span></div>' : '') + '</div>';
    case 'photo':
      var tag = (b || 'profile').trim().toLowerCase();
      if (!photos(tag).length) return '';
      return '<figure class="pimg"><div class="rotbox" data-tag="' + esc(tag) + '"></div>' + (h ? '<figcaption>' + esc(h) + '</figcaption>' : '') + '</figure>';
    case 'intro':
      var sp = F.site, facts = lines(s.items).map(cells), ptag = 'profile';
      var ib = (PAGES.some(function(x){ return x.id === 'contact'; }) ? link('Get in touch', '#contact', '') : '') + (RECPAGE ? link('Read the record', '#' + RECPAGE, s.tone === 'dark' ? 'ghost' : 'outline') : '');
      return '<div class="intro"><div><h1>' + esc(h || sp.name || '') + '</h1>' + (sp.degrees ? '<p class="cred">' + esc(sp.degrees) + '</p>' : '') +
        (b ? '<p class="intro-lead">' + esc(b) + '</p>' : '') +
        (facts.length ? '<dl class="facts">' + facts.map(function(c){ return '<div><dt>' + esc(c[0]) + '</dt><dd>' + esc(c[1] || '') + '</dd></div>'; }).join('') + '</dl>' : '') +
        (ib ? '<div class="acts">' + ib + '</div>' : '') + '</div>' +
        (photos(ptag).length ? '<div class="frame"><div class="rotbox" data-tag="' + ptag + '"></div></div>' : '') + '</div>';
    case 'expertise':
      var groups = lines(s.items);
      if (!groups.length) return '';
      return (h ? '<h2>' + esc(h) + '</h2>' : '') + (b ? '<p class="lead2">' + esc(b) + '</p>' : '') + '<div class="xp">' + groups.map(function(l){
        var c = cells(l);
        return '<article><h3>' + esc(c[0]) + '</h3><div class="tags">' + parts(c.slice(1).join('|')).map(function(t){ return '<span class="tag">' + esc(t) + '</span>'; }).join('') + '</div></article>';
      }).join('') + '</div>';
    case 'badges':
      var bs = lines(s.items);
      if (!bs.length) return '';
      return (h ? '<h2>' + esc(h) + '</h2>' : '') + (b ? '<p class="lead2">' + esc(b) + '</p>' : '') + '<div class="badges' + (bs.length === 2 || bs.length === 4 ? ' two' : '') + '">' + bs.map(function(l){
        var c = cells(l);
        return '<div class="badge"><b>' + esc(c[0]) + '</b>' + (c[2] ? '<time>' + esc(c[2]) + '</time>' : '') + (c[1] ? '<span>' + esc(c[1]) + '</span>' : '') + '</div>';
      }).join('') + '</div>';
    case 'numbers':
      var ns = lines(s.items);
      if (!ns.length) return '';
      return (h ? '<h2>' + esc(h) + '</h2>' : '') + '<div class="nums" style="--n:' + Math.min(4, ns.length) + '">' + ns.map(function(l){
        var c = cells(l), v = token(c[0]);
        return '<div><b class="js-num" data-v="' + esc(v) + '">' + esc(v) + '</b>' + (c[1] ? '<span>' + esc(c[1]) + '</span>' : '') + '</div>';
      }).join('') + '</div>';
    case 'ticker':
      var words = parts(s.items).length ? parts(s.items) : tally('skills', true).slice(0, 20).map(function(r){ return r[0]; });
      if (!words.length) return '';
      var run = words.map(function(w){ return '<span>' + esc(w) + '</span>'; }).join('');
      return '<div class="ticker" aria-label="' + esc(h || 'Skills') + '"><div class="ticker-track" style="--dur:' + Math.max(30, words.length * 4) + 's">' + run + run.replace(/<span>/g, '<span aria-hidden="true">') + '</div></div>';
    case 'cta':
      var cb = lines(s.items).map(function(l, i){ var c = cells(l); return link(c[0], c[1], i ? (s.tone === 'dark' ? 'ghost' : 'outline') : ''); }).join('');
      return '<div class="cta"><div>' + (h ? '<h2>' + esc(h) + '</h2>' : '') + (b ? '<p>' + esc(b) + '</p>' : '') + '</div>' + (cb ? '<div class="acts">' + cb + '</div>' : '') + '</div>';
    case 'contact':
      var si = F.site, ways = '', acts = '';
      if (si.email){ ways += '<dt>Email</dt><dd><a href="mailto:' + esc(si.email) + '">' + esc(si.email) + '</a></dd>'; acts += '<a class="btn deep" href="mailto:' + esc(si.email) + '">Send an email</a><button class="btn outline" id="copy-email" type="button">Copy email address</button>'; }
      if (si.phone) ways += '<dt>Phone</dt><dd><a href="tel:' + esc(si.phone.replace(/[^\d+]/g, '')) + '">' + esc(si.phone) + '</a></dd>';
      if (si.work_email) ways += '<dt>Work email</dt><dd><a href="mailto:' + esc(si.work_email) + '">' + esc(si.work_email) + '</a></dd>';
      var wp = parts(si.work_phone);
      if (wp.length) ways += '<dt>Work phone</dt><dd>' + wp.map(function(n){ return '<a href="tel:' + esc(n.replace(/[^\d+]/g, '')) + '">' + esc(n) + '</a>'; }).join('<span class="sep"> | </span>') + '</dd>';
      if (si.office_address) ways += '<dt>Office</dt><dd>' + esc(si.office_address) + '</dd>';
      if (si.office_website) ways += '<dt>Website</dt><dd><a href="' + esc(si.office_website) + '" target="_blank" rel="noopener">' + esc(si.office_website.replace(/^https?:\/\//, '').replace(/\/$/, '')) + '</a></dd>';
      if (si.linkedin) ways += '<dt>LinkedIn</dt><dd><a href="' + esc(si.linkedin) + '" target="_blank" rel="noopener">' + esc(si.linkedin.replace(/^https?:\/\/(www\.)?/, '').replace(/\/$/, '')) + '</a></dd>';
      if (si.email || si.phone) acts += '<a class="btn outline" id="vcard" href="' + vcard() + '" download="' + esc((si.name || 'contact').replace(/\s+/g, '-')) + '.vcf">Save contact</a>';
      return '<div class="reachgrid"><div><h1>' + esc(h) + '</h1>' + (b ? '<p class="reach">' + esc(b) + '</p>' : '') + ((si.name || si.degrees) ? '<p class="card-id"><b>' + esc(si.name || '') + '</b>' + (si.degrees ? '<span>' + esc(si.degrees) + '</span>' : '') + '</p>' : '') + (ways ? '<dl class="ways">' + ways + '</dl>' : '') + (acts ? '<div class="acts">' + acts + '</div>' : '') + '</div>' +
        (photos('contact').length ? '<div class="arch"><div class="rotbox" data-tag="contact"></div></div>' : '') + '</div>';
  }
  return '';
}

function vcard(){
  var s = F.site, full = s.name || '', pre = (full.match(/^(Engr\.|Dr\.|Prof\.)\s*/) || [''])[0], n = full.slice(pre.length).split(' ');
  var x = function(t){ return String(t).replace(/([,;])/g, '\\$1'); };
  var v = ['BEGIN:VCARD', 'VERSION:3.0', 'N:' + x(n.slice(-1).join('')) + ';' + x(n.slice(0, -1).join(' ')) + ';;' + x(pre.trim()) + ';' + x(s.degrees || ''), 'FN:' + x(full), 'TITLE:' + x(s.role || '')];
  if (s.email) v.push('EMAIL;TYPE=INTERNET,HOME:' + s.email);
  if (s.work_email) v.push('EMAIL;TYPE=INTERNET,WORK:' + s.work_email);
  if (s.phone) v.push('TEL;TYPE=CELL:' + s.phone.replace(/[^\d+]/g, ''));
  parts(s.work_phone).forEach(function(p){ v.push('TEL;TYPE=WORK:' + p.replace(/[^\d+]/g, '')); });
  v.push('URL:' + location.origin + location.pathname);
  if (s.office_website) v.push('URL;TYPE=WORK:' + s.office_website);
  if (s.office_address) v.push('ADR;TYPE=WORK:;;' + x(s.office_address) + ';;;;');
  else if (s.location) v.push('ADR;TYPE=WORK:;;;' + x(s.location) + ';;;');
  v.push('END:VCARD');
  return 'data:text/vcard;charset=utf-8,' + encodeURIComponent(v.join('\r\n'));
}

// ---------------------------------------------------------------- live numbers
// {entries}, {certs} and {years:YYYY-MM} in a Numbers section are counted from the journal and the date
function token(v){
  return String(v || '').replace(/\{entries\}/g, DATA.length)
    .replace(/\{certs\}/g, DATA.filter(function(d){ return /(certif|course|diploma|workshop|training)/i.test(d.ach); }).length)
    .replace(/\{years:(\d{4})-(\d{1,2})\}/g, function(_, y, m){ var t = new Date(); return Math.max(0, Math.floor(((t.getFullYear() - y) * 12 + t.getMonth() + 1 - m) / 12)); });
}
function numbers(){
  if (counted || REDUCE || !('IntersectionObserver' in window)){ counted = true; return; }
  counted = true;
  all('.js-num').forEach(function(el){
    var m = String(el.dataset.v).match(/^(\D*)(\d+)(.*)$/);
    if (!m) return;
    el.textContent = m[1] + '0' + m[3];
    var io = new IntersectionObserver(function(es){
      if (!es[0].isIntersecting) return;
      io.disconnect();
      var t0 = performance.now(), to = +m[2];
      (function step(t){ var k = Math.min(1, (t - t0) / 1500), e = 1 - Math.pow(1 - k, 3); el.textContent = m[1] + Math.round(to * e) + m[3]; if (k < 1) requestAnimationFrame(step); })(t0);
    }, {threshold: .5});
    io.observe(el);
  });
}

// ---------------------------------------------------------------- photo slideshow
function slideshows(){
  clearInterval(showTimer);
  all('.show').forEach(function(sh){
    var figs = sh.querySelectorAll('.stage figure'), thumbs = sh.querySelectorAll('.thumbs button'), count = sh.querySelector('.count');
    if (figs.length < 2) return;
    sh._i = 0;
    sh._set = function(i){
      i = (i + figs.length) % figs.length; sh._i = i;
      figs.forEach(function(f, k){ f.classList.toggle('on', k === i); });
      thumbs.forEach(function(t, k){ if (k === i) t.setAttribute('aria-current', 'true'); else t.removeAttribute('aria-current'); });
      // keep the active thumbnail in view by scrolling only the thumbnail strip, never the page
      var strip = sh.querySelector('.thumbs'), cur = thumbs[i];
      if (strip && cur && strip.scrollWidth > strip.clientWidth){
        var left = cur.offsetLeft - strip.offsetLeft, right = left + cur.offsetWidth;
        if (left < strip.scrollLeft || right > strip.scrollLeft + strip.clientWidth) strip.scrollTo({left: Math.max(0, left - 12), behavior: 'smooth'});
      }
      if (count) count.textContent = (i + 1) + ' / ' + figs.length;
    };
    sh.addEventListener('mouseenter', function(){ sh._pause = true; });
    sh.addEventListener('mouseleave', function(){ sh._pause = false; });
    var x0 = null;
    sh.addEventListener('touchstart', function(e){ x0 = e.touches[0].clientX; }, {passive: true});
    sh.addEventListener('touchend', function(e){ if (x0 === null) return; var dx = e.changedTouches[0].clientX - x0; x0 = null; if (Math.abs(dx) > 40){ sh._set(sh._i + (dx < 0 ? 1 : -1)); sh._hold = Date.now(); } });
  });
  if (REDUCE) return;
  showTimer = setInterval(function(){
    if (document.hidden) return;
    all('.show').forEach(function(sh){
      if (!sh._set || sh._pause || !sh.offsetParent || Date.now() - (sh._hold || 0) < 12000) return;
      var next = sh.querySelectorAll('.stage img')[(sh._i + 1) % sh.querySelectorAll('.stage img').length];
      if (!(next.complete && next.naturalWidth)){ next.loading = 'eager'; return; }
      sh._set(sh._i + 1);
    });
  }, 6000);
}

// ---------------------------------------------------------------- rotating photos
function rotation(){
  clearInterval(rotTimer);
  all('.rotbox').forEach(function(box){
    var ps = photos(box.dataset.tag);
    if (!ps.length){ var host = box.closest('.arch,.frame'); (host || box).remove(); return; }
    box.innerHTML = ps.map(function(p, i){
      return '<img src="' + esc(p.url) + '" alt="' + esc(p.caption || F.site.name || 'Photo') + '" style="object-position:' + esc(p.position || '50% 30%') + '"' + (i ? '' : ' class="on"') + '>';
    }).join('');
  });
  if (window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  var secs = Math.max(2, parseFloat(F.site.rotate_seconds) || 5);
  rotTimer = setInterval(function(){
    if (document.hidden) return;
    all('.rotbox').forEach(function(box){
      if (!box.offsetParent) return;
      var imgs = box.querySelectorAll('img');
      if (imgs.length < 2) return;
      var i = [].map.call(imgs, function(x){ return x.classList.contains('on'); }).indexOf(true), n = (i + 1) % imgs.length;
      if (!(imgs[n].complete && imgs[n].naturalWidth)) return; // wait for the next photo to finish loading
      imgs[i].classList.remove('on'); imgs[n].classList.add('on');
    });
  }, secs * 1000);
}

// ---------------------------------------------------------------- pages (shareable as #page-id)
function current(){ var h = decodeURIComponent(location.hash.slice(1)); return PAGES.some(function(p){ return p.id === h; }) ? h : HOME; }
function show(v, keepScroll){
  all('.view').forEach(function(el){ el.hidden = el.id !== 'v-' + v; });
  all('.nav a').forEach(function(a){ if (a.dataset.go === v) a.setAttribute('aria-current', 'page'); else a.removeAttribute('aria-current'); });
  var p = PAGES.filter(function(x){ return x.id === v; })[0] || {}, s = F.site;
  document.title = v === HOME ? (s.name || '') + (s.role ? ' | ' + s.role : '') : p.label + ' | ' + (s.name || '');
  if (v === RECPAGE) drawRecord();
  if (!keepScroll) window.scrollTo(0, 0);
}
function go(v){
  if (v === HOME){ if (location.hash) history.pushState(null, '', location.pathname); show(v); }
  else if (location.hash === '#' + v) show(v);
  else location.hash = v;
}
window.addEventListener('hashchange', function(){ if (F) show(current()); });
window.addEventListener('popstate', function(){ if (F) show(current()); });

document.addEventListener('click', function(e){
  var sb = e.target.closest('[data-show],[data-show-to]');
  if (sb){
    var sh = sb.closest('.show');
    if (sh && sh._set){ sh._set(sb.dataset.showTo != null ? +sb.dataset.showTo : sh._i + (+sb.dataset.show)); sh._hold = Date.now(); }
    return;
  }
  var g = e.target.closest('[data-go]');
  if (g && F){
    e.preventDefault();
    if (g.dataset.year){ st.year = +g.dataset.year; st.cat = 'All'; st.q = ''; if ($('q')) $('q').value = ''; }
    go(g.dataset.go); return;
  }
  var line = e.target.closest('#list .line');
  if (line){ var more = line.nextElementSibling, open = more.hidden; more.hidden = !open; line.setAttribute('aria-expanded', open ? 'true' : 'false'); return; }
  var chip = e.target.closest('#chips button');
  if (chip){ st.cat = chip.dataset.c; drawRecord(); return; }
  if (e.target.id === 'clr'){ st.year = 0; drawRecord(); return; }
  if (e.target.id === 'copy-email'){
    var b = e.target, email = F.site.email;
    var done = function(t){ b.textContent = t; setTimeout(function(){ b.textContent = 'Copy email address'; }, 2200); };
    try { navigator.clipboard.writeText(email).then(function(){ done('Copied'); }, function(){ done(email); }); } catch (err) { done(email); }
  }
});
document.addEventListener('input', function(e){ if (e.target.id === 'q'){ st.q = e.target.value.trim().toLowerCase(); drawRecord(); } });

// ---------------------------------------------------------------- journal blocks
function drawYears(){
  var ys = DATA.map(function(d){ return d.y; }).filter(Boolean);
  if (!ys.length) return;
  var minY = Math.min.apply(null, ys), maxY = Math.max.apply(null, ys), perY = {}, peak = 1;
  ys.forEach(function(y){ perY[y] = (perY[y] || 0) + 1; if (perY[y] > peak) peak = perY[y]; });
  all('.js-count').forEach(function(el){ el.textContent = DATA.length + ' entries since ' + minY + '.' + (RECPAGE ? ' Choose a year to read it.' : ''); });
  var bh = '';
  for (var y = minY; y <= maxY; y++){
    var n = perY[y] || 0, h = n ? Math.max(4, Math.round(n / peak * 104)) : 1, hs = animated ? ' style="height:' + h + 'px"' : '';
    bh += n ? '<button' + (RECPAGE ? ' data-go="' + esc(RECPAGE) + '" data-year="' + y + '"' : ' disabled') + ' aria-label="' + y + ', ' + n + ' entries"><b>' + n + '</b><i data-h="' + h + '"' + hs + '></i><span>' + y + '</span></button>'
            : '<button disabled aria-label="' + y + ', no entries"><i data-h="1"' + hs + '></i><span>' + y + '</span></button>';
  }
  all('.js-bars').forEach(function(el){ el.innerHTML = bh; });
  if (!animated){
    animated = true;
    setTimeout(function(){ all('.js-bars i').forEach(function(i, k){ setTimeout(function(){ i.style.height = i.dataset.h + 'px'; }, (k % 20) * 45); }); }, 150);
  }
}
function drawLatest(){
  all('.js-latest').forEach(function(box){
    box.innerHTML = DATA.slice(0, +box.dataset.n || 3).map(function(d){
      var go = RECPAGE ? ' href="#' + esc(RECPAGE) + '" data-go="' + esc(RECPAGE) + '"' : '';
      var org = /^personal development$/i.test(d.org || '') ? '' : d.org;
      return '<a class="card"' + go + '><div class="meta"><b>' + esc(d.cat) + '</b><span>' + (d.m ? MN[d.m] + ' ' : '') + (d.y || '') + '</span></div><h3>' + esc(d.ach) + '</h3>' +
        (d.action ? '<p>' + esc(d.action.replace(/\s+/g, ' ')) + '</p>' : '') + (org ? '<div class="org">' + esc(org) + '</div>' : '') + '</a>';
    }).join('');
  });
}
function drawRecord(){
  if (!$('list') || !DATA.length) return;
  $('chips').innerHTML = cats.map(function(c){ return '<button data-c="' + esc(c) + '" aria-pressed="' + (c === st.cat) + '">' + esc(c) + '</button>'; }).join('');
  $('yearnote').innerHTML = st.year ? '<button id="clr">Showing ' + st.year + ' only. Show every year</button>' : '';
  if ($('q').value.trim().toLowerCase() !== st.q) $('q').value = st.q;
  var rows = DATA.filter(function(d){ return (st.cat === 'All' || d.cat === st.cat) && (!st.year || d.y === st.year) && (!st.q || d.hay.indexOf(st.q) > -1); });
  if (!rows.length){ $('list').innerHTML = '<p class="none">Nothing matches. Clear the search or choose another category.</p>'; return; }
  var html = '', cur = null, group = [];
  function flush(){ if (cur !== null) html += '<section class="yr"><h3>' + (cur || 'Undated') + '<small>' + group.length + (group.length === 1 ? ' entry' : ' entries') + '</small></h3><ul>' + group.join('') + '</ul></section>'; }
  rows.forEach(function(d){
    if (d.y !== cur){ flush(); cur = d.y; group = []; }
    var dl = '';
    if (d.skills) dl += '<dt>Skills</dt><dd>' + esc(parts(d.skills).join(', ')) + '</dd>';
    if (d.tools) dl += '<dt>Tools</dt><dd>' + esc(parts(d.tools).join(', ')) + '</dd>';
    if (d.org) dl += '<dt>For</dt><dd>' + esc(d.org) + '</dd>';
    group.push('<li class="entry"><button class="line" aria-expanded="false"><span class="when">' + (d.m ? MN[d.m] : '') + '</span><span class="what">' + esc(d.ach) + '</span><span class="cat">' + esc(d.cat) + '</span></button><div class="more" hidden>' +
      (d.action ? '<p>' + esc(d.action) + '</p>' : '') + (d.metric ? '<p>' + esc(d.metric) + '</p>' : '') + (dl ? '<dl>' + dl + '</dl>' : '') + '</div></li>');
  });
  flush();
  $('list').innerHTML = html;
}
function tally(key, split){
  var o = {};
  DATA.forEach(function(d){ (split ? parts(d[key]) : [d[key]]).forEach(function(k){ if (k) o[k] = (o[k] || 0) + 1; }); });
  return Object.keys(o).map(function(k){ return [k, o[k]]; }).sort(function(a, b){ return b[1] - a[1]; });
}
function meter(list){
  var max = list.length ? list[0][1] : 1;
  return list.map(function(r){ return '<div class="m"><div style="--p:' + Math.round(r[1] / max * 100) + '%">' + esc(r[0]) + '</div><b>' + r[1] + '</b></div>'; }).join('');
}
function drawStats(){
  all('.js-mcat').forEach(function(el){ el.innerHTML = meter(tally('cat', false)); });
  all('.js-mskill').forEach(function(el){ el.innerHTML = meter(tally('skills', true).slice(0, 12)); });
  all('.js-mtool').forEach(function(el){ el.innerHTML = tally('tools', true).slice(0, 16).map(function(r){ return '<span class="tag">' + esc(r[0]) + '</span>'; }).join(''); });
}

load();
